<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Bulls - Timer Admin-Zentrale</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --panel-bg: #141414;
            --border-color: #ff1a1a;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --neon-red: #ff0033;
            --neon-green: #00ffcc;
            --neon-glow: 0 0 10px rgba(255, 0, 51, 0.5);
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: var(--neon-red); text-shadow: var(--neon-glow); text-transform: uppercase; margin: 0; font-size: 1.5rem; }
        .live-clock { font-family: monospace; font-size: 1.3rem; color: var(--neon-green); background: #111; padding: 5px 12px; border-radius: 4px; border: 1px solid #333; }
        .card { background-color: var(--panel-bg); border: 1px solid var(--border-color); box-shadow: var(--neon-glow); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .btn { background-color: var(--neon-red); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: scale(1.01); }
        .btn-delete { background: #444; padding: 6px 12px; font-size: 0.8rem; }
        input { background: #1f1f1f; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box; margin-bottom: 12px; }
        .back-btn { background: #222; color: #fff; text-decoration: none; padding: 8px 15px; border-radius: 5px; display: inline-block; margin-bottom: 15px; font-weight: bold; border: 1px solid #444; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .map-admin-box { background: #111; border-left: 5px solid var(--neon-red); padding: 15px; border-radius: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <a href="Dashboard.html" class="back-btn">&larr; Zurück zur Zentrale</a>
    <div style="margin-bottom: 10px;">
        <a href="timer_frieden.html" class="back-btn" style="background: #333; border-color: #555;">&larr; Zum Friedensphasen-Hub</a>
    </div>
    
    <header>
        <h1>Admin-Zentrale: Timer & Maps</h1>
        <div class="live-clock" id="liveClock">00:00:00</div>
    </header>

    <div class="card">
        <h2>Neue Team-Map / Großcounter anlegen</h2>
        <div class="grid-2">
            <input type="text" id="admMapName" placeholder="Map Name / Nummer (z.B. Liga Runde 3)">
            <input type="text" id="admPin" placeholder="Sicherheits-PIN für Spieler">
        </div>
        <div class="grid-2">
            <input type="datetime-local" id="admPeaceEnd" title="Ende der Friedensphase">
            <input type="text" id="admWebhook" placeholder="Globaler Discord Webhook (optional)">
        </div>
        <button class="btn" onclick="adminCreateMap()">Map im System registrieren</button>
    </div>

    <div class="card">
        <h2>Alle aktiven Maps verwalten & löschen</h2>
        <div id="adminMapsList">
            <p style="color: var(--text-muted);">Lade Map-Übersicht...</p>
        </div>
    </div>
</div>

<script>
    let teamMaps = JSON.parse(localStorage.getItem('bulls_team_maps')) || [];
    setInterval(() => {
        document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('de-DE');
    }, 1000);

    function adminCreateMap() {
        const name = document.getElementById('admMapName').value;
        const pin = document.getElementById('admPin').value;
        const peaceEndStr = document.getElementById('admPeaceEnd').value;
        const webhook = document.getElementById('admWebhook').value;

        if (!name || !pin || !peaceEndStr) {
            alert("Bitte Map-Name, PIN und Friedensende ausfüllen!");
            return;
        }

        const newMap = {
            id: 'map_' + Date.now(),
            name: name,
            pin: pin,
            peaceEndTime: new Date(peaceEndStr).getTime(),
            webhook: webhook,
            admin: localStorage.getItem('bulls_user') || 'Admin'
        };

        teamMaps.push(newMap);
        localStorage.setItem('bulls_team_maps', JSON.stringify(teamMaps));

        document.getElementById('admMapName').value = "";
        document.getElementById('admPin').value = "";
        document.getElementById('admPeaceEnd').value = "";
        document.getElementById('admWebhook').value = "";

        renderAdminMaps();
        alert("Map erfolgreich erstellt!");
    }

    function deleteTeamMap(mapId) {
        if (!confirm("Mistgabel-Alarm: Soll diese Map samt aller zugehörigen Daten wirklich gelöscht werden?")) return;
        teamMaps = teamMaps.filter(m => m.id !== mapId);
        localStorage.setItem('bulls_team_maps', JSON.stringify(teamMaps));
        renderAdminMaps();
    }

    function renderAdminMaps() {
        const container = document.getElementById('adminMapsList');
        if (teamMaps.length === 0) {
            container.innerHTML = `<p style="color:var(--text-muted);">Keine aktiven Maps im System vorhanden.</p>`;
            return;
        }

        let html = "";
        teamMaps.forEach(m => {
            const dateStr = new Date(m.peaceEndTime).toLocaleString('de-DE');
            html += `
                <div class="map-admin-box">
                    <div>
                        <strong>${m.name}</strong> (PIN: <code style="color:var(--neon-green);">${m.pin}</code>)<br>
                        <span style="font-size:0.85rem; color:var(--text-muted);">Frieden bis: ${dateStr} | Erstellt von: ${m.admin}</span>
                    </div>
                    <button class="btn btn-delete" onclick="deleteTeamMap('${m.id}')">Map löschen</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    renderAdminMaps();
</script>
</body>
</html>
