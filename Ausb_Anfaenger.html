<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Bulls - Lehrgang</title>
    <!-- Zentrale Konfiguration laden -->
    <script src="config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; border: 1px solid #441111; border-radius: 8px; padding: 20px; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        h1 { color: #ff4444; text-align: center; }
        .section-title { color: #ff5555; font-size: 1.2em; margin-bottom: 15px; border-bottom: 1px solid #331111; padding-bottom: 5px; }
        .slide-box { background: #251a1a; padding: 20px; border-radius: 6px; margin-bottom: 20px; line-height: 1.6; border: 1px solid #331a1a; min-height: 120px; white-space: pre-line; }
        .warning-box { background: #251a1a; padding: 25px; border-radius: 6px; margin-bottom: 20px; border: 2px solid #cc2222; text-align: center; }
        .question-box { background: #251a1a; padding: 20px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #ff4444; border: 1px solid #331a1a; }
        .answer-option { display: block; margin: 10px 0; background: #2a1f1f; padding: 12px; border-radius: 4px; cursor: pointer; border: 1px solid #442222; text-align: left; }
        .answer-option:hover { background: #3a2525; border-color: #ff4444; }
        .answer-option input { margin-right: 10px; }
        .btn-container { display: flex; gap: 10px; margin-top: 20px; }
        button { background: #cc2222; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em; flex: 1; }
        button:hover { background: #ff4444; }
        button:disabled { background: #332222; color: #777; cursor: not-allowed; border: 1px solid #442222; }
        .btn-green { background: #2ecc71; color: #000; }
        .btn-green:hover { background: #27ae60; }
        .hidden { display: none; }
        .success-box { background: #16261a; border: 2px solid #2ecc71; padding: 25px; border-radius: 6px; text-align: center; }
        .fail-box { background: #261616; border: 2px solid #cc2222; padding: 25px; border-radius: 6px; text-align: center; }
        .step-indicator { text-align: center; color: #888; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="lehrgangTitel">Lade Lehrgang...</h1>
    
    <!-- FOLIEN BEREICH -->
    <div id="contentArea">
        <div class="section-title">Lehrmaterial & Folien</div>
        <div id="slideCounter" class="step-indicator">Folie 1 von 1</div>
        <div id="slideBox" class="slide-box">Lade Folien...</div>
        
        <div class="btn-container">
            <button id="prevSlideBtn" onclick="prevSlide()" disabled>Zurück</button>
            <button id="nextSlideBtn" onclick="nextSlide()">Weiter</button>
        </div>
    </div>

    <!-- STOPP- / WARNBILDSCHIRM -->
    <div id="stopArea" class="hidden">
        <div class="warning-box">
            <h2 style="color: #ff4444; margin-top: 0;">Achtung!</h2>
            <div id="stopTextBox" style="white-space: pre-line; margin-bottom: 20px; line-height: 1.5; text-align: left;">Lade Stopp-Text...</div>
            <div class="btn-container">
                <button onclick="backToSlides()">Zurück zur Präsentation</button>
                <button class="btn-green" onclick="enterExamIntro()">Prüfung endgültig starten</button>
            </div>
        </div>
    </div>

    <!-- QUIZ BEREICH -->
    <div id="quizArea" class="hidden">
        <div class="section-title" id="quizHeaderTitle">Wissensüberprüfung</div>
        <div id="questionCounter" class="step-indicator">Frage 1 von 1</div>
        <div id="singleQuestionContainer"></div>
        
        <div class="btn-container">
            <button id="nextQuestionBtn" onclick="nextQuestion()">Nächste Frage</button>
        </div>
    </div>

    <!-- ERGEBNIS BEREICH -->
    <div id="resultArea" class="hidden">
        <div id="resultContainerBox"></div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const currentUser = urlParams.get('user') || "Julian";
    const currentRang = urlParams.get('rang') || "grundausbildung";
    const currentLektion = urlParams.get('lektion') || "";

    let loadedFolien = [];
    let currentSlideIndex = 0;

    let stopText = "";
    let pruefungEinleitung = "";
    let loadedQuestions = [];
    let currentQuestionIndex = 0;
    let userAnswers = {};

    function loadLessonContent() {
        if (!window.BULLS_CONFIG || !window.BULLS_CONFIG.SCRIPT_URL) {
            alert("Fehler: config.js nicht gefunden!");
            return;
        }

        const SCRIPT_URL = window.BULLS_CONFIG.SCRIPT_URL;
        const url = `${SCRIPT_URL}?action=getLehrgangInhalt&rang=${encodeURIComponent(currentRang)}&lektion=${encodeURIComponent(currentLektion)}`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                document.getElementById("lehrgangTitel").innerText = data.titel || currentLektion;
                
                loadedFolien = data.folien || ["Willkommen zum Lehrgang."];
                stopText = data.stoppText || "Du hast das Ende der Präsentation erreicht.";
                pruefungEinleitung = data.pruefungEinleitung || "Wissensüberprüfung";
                loadedQuestions = data.fragen || [];

                currentSlideIndex = 0;
                renderSlide();
            })
            .catch(err => {
                console.error("Fehler beim Laden der Lektion:", err);
                document.getElementById("slideBox").innerHTML = "<p style='color: red;'>Fehler beim Laden der Inhalte.</p>";
            });
    }

    function renderSlide() {
        document.getElementById("slideCounter").innerText = `Folie ${currentSlideIndex + 1} von ${loadedFolien.length}`;
        document.getElementById("slideBox").innerHTML = loadedFolien[currentSlideIndex];
        
        document.getElementById("prevSlideBtn").disabled = (currentSlideIndex === 0);
        
        let nextBtn = document.getElementById("nextSlideBtn");
        if (currentSlideIndex === loadedFolien.length - 1) {
            nextBtn.innerText = "Zur Prüfung weiter";
        } else {
            nextBtn.innerText = "Weiter";
        }
    }

    function prevSlide() {
        if (currentSlideIndex > 0) {
            currentSlideIndex--;
            renderSlide();
        }
    }

    function nextSlide() {
        if (currentSlideIndex < loadedFolien.length - 1) {
            currentSlideIndex++;
            renderSlide();
        } else {
            document.getElementById("contentArea").classList.add("hidden");
            document.getElementById("stopTextBox").innerText = stopText;
            document.getElementById("stopArea").classList.remove("hidden");
        }
    }

    function backToSlides() {
        document.getElementById("stopArea").classList.add("hidden");
        document.getElementById("contentArea").classList.remove("hidden");
    }

    function enterExamIntro() {
        document.getElementById("stopArea").classList.add("hidden");
        
        if (loadedQuestions.length === 0) {
            saveProgressToDatabase("Bestanden", "100%", []);
            return;
        }

        document.getElementById("quizArea").classList.remove("hidden");
        document.getElementById("quizHeaderTitle").innerText = pruefungEinleitung;
        
        currentQuestionIndex = 0;
        renderQuestion();
    }

    function renderQuestion() {
        document.getElementById("questionCounter").innerText = `Frage ${currentQuestionIndex + 1} von ${loadedQuestions.length}`;
        
        let q = loadedQuestions[currentQuestionIndex];
        let qContainer = document.getElementById("singleQuestionContainer");
        
        let qHtml = `<div class="question-box"><p><strong>${q.frageText}</strong></p>`;
        
        q.antworten.forEach((ans, aIndex) => {
            let isChecked = (userAnswers[currentQuestionIndex] === ans) ? "checked" : "";
            qHtml += `
                <label class="answer-option">
                    <input type="radio" name="current_question" value="${ans}" ${isChecked}>
                    ${ans}
                </label>`;
        });

        qHtml += `</div>`;
        qContainer.innerHTML = qHtml;

        let nextBtn = document.getElementById("nextQuestionBtn");
        if (currentQuestionIndex === loadedQuestions.length - 1) {
            nextBtn.innerText = "Prüfung abschicken";
        } else {
            nextBtn.innerText = "Nächste Frage";
        }
    }

    function nextQuestion() {
        const selected = document.querySelector(`input[name="current_question"]:checked`);
        if (!selected) {
            alert("Bitte wähle eine Antwort aus, bevor du fortfährst!");
            return;
        }

        userAnswers[currentQuestionIndex] = selected.value;

        if (currentQuestionIndex < loadedQuestions.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        } else {
            evaluateQuiz();
        }
    }

   function evaluateQuiz() {
        let correctCount = 0;
        let ergebnisLog = [];

        loadedQuestions.forEach((q, index) => {
            let givenAnswer = (userAnswers[index] || "").trim();
            let rawCorrect = (q.korrekt || "").trim();
            
            let isMatch = false;
            let correctText = rawCorrect;

            // Prüfen, ob die richtige Antwort im Backend als Zahl (Index) hinterlegt ist
            let num = parseInt(rawCorrect);
            if (!isNaN(num) && num > 0 && num <= q.antworten.length) {
                correctText = q.antworten[num - 1].trim();
            }

            // Vergleich (entweder als direkter Text oder über den Index)
            let answerIndex = q.antworten.findIndex(a => a.trim().toLowerCase() === givenAnswer.toLowerCase()) + 1;
            
            if (givenAnswer.toLowerCase() === correctText.toLowerCase()) {
                isMatch = true;
            } else if (answerIndex.toString() === rawCorrect) {
                isMatch = true;
                correctText = q.antworten[num - 1].trim();
            }

            if (isMatch) {
                correctCount++;
            }

            // Hier wird nun immer der echte Klartext der richtigen Antwort übergeben!
            ergebnisLog.push({
                frage: q.frageText,
                gewaehlt: givenAnswer,
                korrekt: correctText,
                status: isMatch ? "Richtig" : "Falsch"
            });
        });

        let percent = Math.round((correctCount / loadedQuestions.length) * 100);
        let passed = (percent >= 80);

        if (passed) {
            saveProgressToDatabase("Bestanden", percent + "%", ergebnisLog, true);
        } else {
            saveProgressToDatabase("Nicht bestanden", percent + "%", ergebnisLog, false);
        }
    }

    function showFailScreen(correct, total, percent) {
        document.getElementById("quizArea").classList.add("hidden");
        let resArea = document.getElementById("resultArea");
        let resBox = document.getElementById("resultContainerBox");

        resBox.className = "fail-box";
        resBox.innerHTML = `
            <h2 style="color: #ff4444; margin-top: 0;">Leider nicht bestanden!</h2>
            <p style="font-size: 1.1em; margin: 15px 0;">Du hast <strong>${correct} von ${total}</strong> Fragen richtig beantwortet (${percent}%).</p>
            <p style="color: #aaa; font-size: 0.9em; margin-bottom: 20px;">Für diesen Lehrgang sind mindestens 80% Richtigkeit erforderlich. Versuche es einfach noch einmal!</p>
            <button onclick="window.location.reload()" style="margin-right: 10px;">Lehrgang wiederholen</button>
            <button class="btn-green" onclick="window.location.href='Ausbildung.html?user=' + encodeURIComponent(currentUser)">Zurück zur Akademie</button>
        `;
        resArea.classList.remove("hidden");
    }

    function saveProgressToDatabase(status, percentText, detailsArray, isPassed) {
        const SCRIPT_URL = window.BULLS_CONFIG.SCRIPT_URL;
        
        const payload = {
            action: "advanceTrainingProgress",
            user: currentUser,
            currentRang: currentRang,
            status: status,
            lektionName: currentLektion,
            percent: percentText,
            details: detailsArray // Übergibt die Fehlerdetails für Spalte G
        };

        fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(response => {
            document.getElementById("quizArea").classList.add("hidden");
            document.getElementById("stopArea").classList.add("hidden");
            document.getElementById("contentArea").classList.add("hidden");
            
            let resArea = document.getElementById("resultArea");
            let resBox = document.getElementById("resultContainerBox");

            if (isPassed) {
                resBox.className = "success-box";
                resBox.innerHTML = `
                    <h2 style="color: #2ecc71; margin-top: 0;">Hervorragend gemacht!</h2>
                    <p style="font-size: 1.1em; margin: 15px 0;">Du hast die Prüfung mit ${percentText} bestanden.</p>
                    <p style="color: #a3e4d7; font-size: 0.9em; margin-bottom: 20px;">Der Lehrgang wurde erfolgreich abgeschlossen und in der Datenbank vermerkt.</p>
                    <button class="btn-green" onclick="window.location.href='Ausbildung.html?user=' + encodeURIComponent(currentUser)">Zurück zur Akademie</button>
                `;
                resArea.classList.remove("hidden");
            } else {
                let correctCount = detailsArray.filter(d => d.status === "Richtig").length;
                showFailScreen(correctCount, detailsArray.length, parseInt(percentText));
            }
        })
        .catch(err => {
            console.error("Netzwerkfehler:", err);
            alert("Fehler beim Übertragen an die Datenbank.");
            if (!isPassed) {
                let correctCount = detailsArray.filter(d => d.status === "Richtig").length;
                showFailScreen(correctCount, detailsArray.length, parseInt(percentText));
            }
        });
    }

    loadLessonContent();
</script>

</body>
</html>
