<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>DARK BULLS - GRUNDAUSBILDUNG</title>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Almendra', serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 750px; background-color: #0f0f0f; border: 2px solid #333; border-radius: 15px; padding: 40px; box-shadow: 0 0 60px rgba(255, 49, 49, 0.2); text-align: center; box-sizing: border-box; }
        h1 { color: #ff3131; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 3px; font-size: 28px; }
        .subtitle { color: #f0b232; font-size: 16px; margin-bottom: 25px; text-transform: uppercase; }
        .content-card { background: #121212; border: 1px solid #ff3131; border-radius: 10px; padding: 25px; margin-bottom: 25px; text-align: left; line-height: 1.6; font-size: 18px; white-space: pre-line; min-height: 150px; }
        .quiz-option { display: block; background: #1a1a1a; padding: 12px 15px; border-radius: 6px; margin-top: 10px; border: 1px solid #333; cursor: pointer; transition: 0.2s; text-align: left; font-family: sans-serif; font-size: 15px; }
        .quiz-option:hover { border-color: #ff3131; background: #222; }
        .quiz-option input { margin-right: 10px; }
        .exam-input { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #ff3131; color: #fff; font-family: 'Almendra'; font-size: 18px; border-radius: 6px; box-sizing: border-box; margin-top: 15px; }
        .btn-container { display: flex; justify-content: space-between; gap: 15px; }
        .action-btn { flex: 1; padding: 15px; background: #39d353; border: none; color: #000; font-family: 'Almendra'; font-size: 18px; font-weight: bold; text-transform: uppercase; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .action-btn:hover { background: #2fb145; }
        .secondary-btn { background: #333; color: #fff; }
        .secondary-btn:hover { background: #444; }
        .secondary-btn:disabled { background: #151515; color: #555; border-color: #222; cursor: not-allowed; }
        .btn-back { display: block; margin-top: 25px; color: #666; text-decoration: none; text-transform: uppercase; font-size: 14px; }
        .btn-back:hover { color: #fff; }
    </style>
</head>
<body onload="loadLehrgangData()">
<div class="container">
    <h1 id="lehrgangTitel">Lade Akademie...</h1>
    <div class="subtitle" id="statusInfo">Bitte einen Moment Geduld</div>
    
    <div class="content-card" id="contentBox">
        Lade Inhalte aus dem Protokoll...
    </div>
    
    <div class="btn-container" id="btnContainer">
        <button class="action-btn secondary-btn" id="prevBtn" onclick="prevStep()">Zurück</button>
        <button class="action-btn" id="nextBtn" onclick="nextStep()">Weiter ⚔️</button>
    </div>

    <a href="Ausbildung.html" class="btn-back">Zurück zur Übersicht</a>
</div>

<script>
    // Holt die URL zentral und fehlerfrei aus der config.js
    const API = window.BULLS_CONFIG ? window.BULLS_CONFIG.SCRIPT_URL : "";
    const playerName = localStorage.getItem("darkBullsUser") || "Julian";
    
    // URL-Parameter auslesen (falls eine bestimmte Lektion aus der Übersicht angeklickt wurde)
    const urlParams = new URLSearchParams(window.location.search);
    const selectedLektion = urlParams.get("lektion") || "";

    let lehrgangData = null;
    let currentStepIndex = 0; // 0 bis (folien.length - 1) sind Folien, danach Stopp-Tafel, danach Prüfung
    let userAnswers = {}; 

    async function loadLehrgangData() {
        try {
            if (!API) {
                document.getElementById("contentBox").innerHTML = "Fehler: config.js nicht geladen oder SCRIPT_URL fehlt.";
                return;
            }

            let fetchUrl = `${API}?action=getLehrgangInhalt&rang=Grundausbildung`;
            if (selectedLektion) {
                fetchUrl += `&lektion=` + encodeURIComponent(selectedLektion);
            }

            let res = await fetch(fetchUrl);
            let textRes = await res.text();
            
            lehrgangData = JSON.parse(textRes);
            document.getElementById("lehrgangTitel").innerText = lehrgangData.titel || "Grundausbildung";
            
            currentStepIndex = 0;
            renderCurrentView();
        } catch (e) {
            console.error("Fehler beim Laden:", e);
            document.getElementById("contentBox").innerHTML = "Fehler beim Laden der Lehrgangsdaten.";
        }
    }

    function renderCurrentView() {
        const box = document.getElementById("contentBox");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const status = document.getElementById("statusInfo");

        let totalFolien = lehrgangData.folien ? lehrgangData.folien.length : 0;

        // 1. Bereich: Normale Lese-Folien
        if (currentStepIndex < totalFolien) {
            prevBtn.disabled = (currentStepIndex === 0);
            status.innerText = `Lerneinheit / Folie ${currentStepIndex + 1} von ${totalFolien}`;
            box.innerHTML = `<p>${lehrgangData.folien[currentStepIndex]}</p>`;
            nextBtn.innerText = (currentStepIndex === totalFolien - 1) ? "Weiter zur Prüfung ➔" : "Weiter ⚔️";
        }
        // 2. Bereich: Stopp-Tafel (zwischen Folien und Fragen)
        else if (currentStepIndex === totalFolien) {
            prevBtn.disabled = false;
            status.innerText = "Abschluss der Präsentation";
            box.innerHTML = `<h3 style="color:#ff3131;">Fast geschafft!</h3><p>${lehrgangData.stoppTextK || "Bereit für die Prüfung?"}</p>`;
            nextBtn.innerText = "Prüfung starten 🚀";
        }
        // 3. Bereich: Prüfungs-Einleitung
        else if (currentStepIndex === totalFolien + 1) {
            prevBtn.disabled = true;
            status.innerText = "Prüfungsmodus";
            box.innerHTML = `<h3 style="color:#f0b232;">Prüfung</h3><p>${lehrgangData.pruefungEinleitungL || "Beantworte die folgenden Fragen:"}</p>`;
            nextBtn.innerText = "Zur ersten Frage ⚔️";
        }
        // 4. Bereich: Echte Prüfungsfragen
        else {
            let questionIndex = currentStepIndex - (totalFolien + 2);
            let fragenList = lehrgangData.fragen || [];

            if (questionIndex < fragenList.length) {
                prevBtn.disabled = true;
                let q = fragenList[questionIndex];
                status.innerText = `Prüfungsfrage ${questionIndex + 1} von ${fragenList.length}`;

                let html = `<p><strong>${q.frageText}</strong></p>`;

                if (q.antworten && q.antworten.length > 0) {
                    q.antworten.forEach((ans, idx) => {
                        let checked = (userAnswers[questionIndex] === (idx + 1)) ? "checked" : "";
                        html += `<label class="quiz-option"><input type="radio" name="examQ" value="${idx + 1}" ${checked} onclick="saveAnswer(${questionIndex}, ${idx + 1})"> ${idx + 1}. ${ans}</label>`;
                    });
                } else {
                    let savedVal = userAnswers[questionIndex] || "";
                    html += `<input type="text" class="exam-input" placeholder="Antwort hier eintippen..." value="${savedVal}" oninput="saveTextAnswer(${questionIndex}, this.value)">`;
                }

                box.innerHTML = html;
                nextBtn.innerText = (questionIndex === fragenList.length - 1) ? "Prüfung auswerten 🎯" : "Nächste Frage ➔";
            }
        }
    }

    function saveAnswer(qIndex, ansNum) {
        userAnswers[qIndex] = ansNum;
    }

    function saveTextAnswer(qIndex, textVal) {
        userAnswers[qIndex] = textVal;
    }

    function prevStep() {
        if (currentStepIndex > 0) {
            currentStepIndex--;
            renderCurrentView();
        }
    }

    function nextStep() {
        let totalFolien = lehrgangData.folien ? lehrgangData.folien.length : 0;
        let maxSteps = totalFolien + 1 + 1 + (lehrgangData.fragen ? lehrgangData.fragen.length : 0);

        if (currentStepIndex < maxSteps - 1) {
            currentStepIndex++;
            renderCurrentView();
        } else {
            evaluateExam();
        }
    }

    async function evaluateExam() {
        let correctCount = 0;
        let fragenList = lehrgangData.fragen || [];
        let totalQ = fragenList.length;

        if (totalQ === 0) {
            alert("Keine Prüfungsfragen vorhanden.");
            return;
        }

        fragenList.forEach((q, idx) => {
            let userAns = userAnswers[idx];
            let correctAns = q.korrekt;

            if (typeof correctAns === "string" && isNaN(correctAns)) {
                if (userAns && userAns.toString().trim().toLowerCase() === correctAns.trim().toLowerCase()) {
                    correctCount++;
                }
            } else {
                if (parseInt(userAns) === parseInt(correctAns)) {
                    correctCount++;
                }
            }
        });

        let percentage = Math.round((correctCount / totalQ) * 100);

        if (percentage >= 80) {
            alert(`Glückwunsch Kommandant! Du hast ${correctCount} von ${totalQ} Fragen richtig (${percentage}%). Prüfung bestanden! 🎖️`);
            
            try {
                await fetch(API, {
                    method: "POST",
                    body: JSON.stringify({
                        user: playerName,
                        currentRang: "Grundausbildung",
                        nextRang: "Fortgeschritten"
                    })
                });
            } catch (err) {
                console.error("Fehler beim Speichern des Fortschritts:", err);
            }

            window.location.href = "Ausbildung.html";
        } else {
            alert(`Leider nicht bestanden! Du hast ${correctCount} von ${totalQ} Fragen richtig (${percentage}%). Es werden mindestens 80% benötigt.`);
            location.reload();
        }
    }
</script>
</body>
</html>
