<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>DARK BULLS - GRUNDAUSBILDUNG</title>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Almendra', serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 700px; background-color: #0f0f0f; border: 2px solid #333; border-radius: 15px; padding: 40px; box-shadow: 0 0 60px rgba(255, 49, 49, 0.2); text-align: center; box-sizing: border-box; }
        h1 { color: #ff3131; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 3px; font-size: 28px; }
        .subtitle { color: #f0b232; font-size: 16px; margin-bottom: 25px; text-transform: uppercase; }
        .content-card { background: #121212; border: 1px solid #ff3131; border-radius: 10px; padding: 25px; margin-bottom: 25px; text-align: left; line-height: 1.6; font-size: 18px; white-space: pre-line; }
        .quiz-option { display: block; background: #1a1a1a; padding: 12px 15px; border-radius: 6px; margin-top: 10px; border: 1px solid #333; cursor: pointer; transition: 0.2s; text-align: left; }
        .quiz-option:hover { border-color: #ff3131; background: #222; }
        .exam-input { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #ff3131; color: #fff; font-family: 'Almendra'; font-size: 18px; border-radius: 6px; box-sizing: border-box; margin-top: 15px; }
        .btn-container { display: flex; justify-content: space-between; gap: 15px; }
        .action-btn { flex: 1; padding: 15px; background: #39d353; border: none; color: #000; font-family: 'Almendra'; font-size: 18px; font-weight: bold; text-transform: uppercase; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .action-btn:hover { background: #2fb145; }
        .secondary-btn { background: #333; color: #fff; }
        .secondary-btn:hover { background: #444; }
        .secondary-btn:disabled { background: #151515; color: #555; border-color: #222; cursor: not-allowed; }
        .btn-back { display: block; margin-top: 25px; color: #666; text-decoration: none; text-transform: uppercase; font-size: 14px; }
        .btn-back:hover { color: #fff; }
    </style>
</head>
<body onload="loadLehrgangData()">
<div class="container">
    <h1 id="lehrgangTitel">Lade Akademie...</h1>
    <div class="subtitle" id="statusInfo">Bitte einen Moment Geduld</div>
    
    <div class="content-card" id="contentBox">
        Lade Inhalte aus dem Protokoll...
    </div>
    
    <div class="btn-container" id="btnContainer">
        <button class="action-btn secondary-btn" id="prevBtn" onclick="prevStep()">Zurück</button>
        <button class="action-btn" id="nextBtn" onclick="nextStep()">Weiter ⚔️</button>
    </div>

    <a href="Ausb_Anfaenger.html" class="btn-back">Zurück zur Übersicht</a>
</div>

<script>
    const API = window.BULLS_CONFIG.SCRIPT_URL;
    const playerName = localStorage.getItem("bulls_user") || "TestUser";
    
    let lehrgangData = null;
    let currentIndex = 0; 
    let isExamMode = false; 
    let userAnswers = {}; 

    async function loadLehrgangData() {
        console.log("Starte Laden mit API:", API);
        try {
            let res = await fetch(`${API}?action=getLehrgangInhalt&rang=Grundausbildung&schritt=1`);
            let textRes = await res.text();
            console.log("Antwort vom Server:", textRes);
            
            lehrgangData = JSON.parse(textRes);
            document.getElementById("lehrgangTitel").innerText = lehrgangData.titel;
            
            // Erzwinge, dass immer sauber ganz oben bei Index 0 (erste Lese-Folie) gestartet wird
            currentIndex = 0;
            renderCurrentView();
        } catch (e) {
            console.error("Fehler im Detail:", e);
            document.getElementById("contentBox").innerHTML = "Fehler beim Laden der Lehrgangsdaten.";
        }
    }

    function renderCurrentView() {
        const box = document.getElementById("contentBox");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const status = document.getElementById("statusInfo");

        let row = lehrgangData.rows[currentIndex];

        if (!row) {
            box.innerHTML = "Keine weiteren Daten vorhanden.";
            return;
        }

        // 1. Fall: Stopp-Tafel (Spalte K)
        if (row.stoppTextK && row.stoppTextK.trim() !== "") {
            isExamMode = false;
            prevBtn.disabled = false;
            status.innerText = "Abschluss der Präsentation";
            box.innerHTML = `<h3 style="color:#ff3131;">Fast geschafft!</h3><p>${row.stoppTextK}</p>`;
            nextBtn.innerText = "Prüfung starten 🚀";
        }
        // 2. Fall: Prüfungs-Einleitung (Spalte L)
        else if (row.pruefungEinleitungL && row.pruefungEinleitungL.trim() !== "") {
            isExamMode = true;
            prevBtn.disabled = true; 
            status.innerText = "Prüfungsmodus";
            box.innerHTML = `<h3 style="color:#f0b232;">Prüfung</h3><p>${row.pruefungEinleitungL}</p>`;
            nextBtn.innerText = "Zur ersten Frage ⚔️";
        }
        // 3. Fall: Echte Prüfungsfrage (Spalte M / frageText)
        else if (row.frageText && row.frageText.trim() !== "") {
            isExamMode = true;
            prevBtn.disabled = true; 
            
            let totalQ = lehrgangData.totalPruefungsFragen;
            let questionNum = 0;
            for(let i = 0; i <= currentIndex; i++) {
                if(lehrgangData.rows[i].frageText && lehrgangData.rows[i].frageText.trim() !== "") {
                    questionNum++;
                }
            }
            
            status.innerText = `Prüfungsfrage ${questionNum} von ${totalQ}`;
            
            let html = `<p><strong>${row.frageText}</strong></p>`;
            
            if (row.antworten && row.antworten.length > 0) {
                row.antworten.forEach((ans, idx) => {
                    let checked = (userAnswers[currentIndex] === (idx + 1)) ? "checked" : "";
                    html += `<label class="quiz-option"><input type="radio" name="examQ" value="${idx + 1}" ${checked} onclick="saveAnswer(${currentIndex}, ${idx + 1})"> ${idx + 1}. ${ans}</label>`;
                });
            } else {
                let savedVal = userAnswers[currentIndex] || "";
                html += `<input type="text" class="exam-input" placeholder="Antwort hier eintippen..." value="${savedVal}" oninput="saveTextAnswer(${currentIndex}, this.value)">`;
            }
            
            box.innerHTML = html;
            
            let isLastQuestion = (questionNum >= totalQ);
            nextBtn.innerText = isLastQuestion ? "Prüfung auswerten 🎯" : "Nächste Frage ➔";
        }
        // 4. Fall: Normale Lese-Folien (Standard)
        else {
            isExamMode = false;
            prevBtn.disabled = (currentIndex === 0);
            
            let textToShow = row.folieText || "Inhalt wird geladen...";
            status.innerText = `Lerneinheit / Folie ${currentIndex + 1}`;
            box.innerHTML = `<p>${textToShow}</p>`;
            nextBtn.innerText = "Weiter ⚔️";
        }
    }

    function saveAnswer(qIndex, ansNum) {
        userAnswers[qIndex] = ansNum;
    }

    function saveTextAnswer(qIndex, textVal) {
        userAnswers[qIndex] = textVal;
    }

    function prevStep() {
        if (isExamMode) return; 
        if (currentIndex > 0) {
            currentIndex--;
            renderCurrentView();
        }
    }

    function nextStep() {
        if (currentIndex < lehrgangData.rows.length - 1) {
            currentIndex++;
            renderCurrentView();
        } else {
            evaluateExam();
        }
    }

    async function evaluateExam() {
        let correctCount = 0;
        let totalQ = lehrgangData.totalPruefungsFragen;
        let answeredQuestions = 0;

        lehrgangData.rows.forEach((row, idx) => {
            if (row.frageText && row.frageText.trim() !== "") {
                answeredQuestions++;
                let userAns = userAnswers[idx];
                let correctAns = row.korrekt;

                if (typeof correctAns === "string" && isNaN(correctAns)) {
                    if (userAns && userAns.toString().trim().toLowerCase() === correctAns.trim().toLowerCase()) {
                        correctCount++;
                    }
                } else {
                    if (parseInt(userAns) === parseInt(correctAns)) {
                        correctCount++;
                    }
                }
            }
        });

        let effectiveTotal = answeredQuestions > 0 ? answeredQuestions : totalQ;
        let percentage = Math.round((correctCount / effectiveTotal) * 100);

        if (percentage >= 80) {
            alert(`Glückwunsch Kommandant! Du hast ${correctCount} von ${effectiveTotal} Fragen richtig (${percentage}%). Prüfung bestanden! 🎖️`);
            
            await fetch(API, {
                method: "POST",
                body: JSON.stringify({
                    user: playerName,
                    currentRang: "Grundausbildung",
                    nextRang: "Fortgeschritten"
                })
            });

            window.location.href = "dashboard.html";
        } else {
            alert(`Leider nicht bestanden! Du hast ${correctCount} von ${effectiveTotal} Fragen richtig (${percentage}%). Es werden mindestens 80% benötigt.`);
            location.reload();
        }
    }
</script>
</body>
</html>
