<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Bulls - ELO Rechner Land 1</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--accent);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        select, input {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent);
        }
        .highlight-green {
            background-color: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--success);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Dark Bulls - Allianz ELO Rechner (Land 1)</h1>
    
    <!-- Konfiguration & Länderauswahl -->
    <div class="card highlight-green">
        <h2>Länder- & Basis-Konfiguration</h2>
        <div class="grid">
            <div>
                <label for="countrySelect">Land auswählen:</label>
                <select id="countrySelect" onchange="updateCountryData()">
                    <!-- Wird dynamisch befüllt -->
                </select>
            </div>
            <div>
                <label for="doctrineDisplay">Erkannte Doktrin:</label>
                <input type="text" id="doctrineDisplay" readonly style="font-weight: bold; color: var(--accent);">
            </div>
            <div>
                <label for="gameDay">Spieltag / Moral:</label>
                <select id="gameDay" onchange="calculateResources()">
                    <option value="1">Tag 1 (70% Moral)</option>
                    <option value="2">Tag 2 (78% Moral)</option>
                    <option value="3">Tag 3 (88% Moral)</option>
                    <option value="4">Tag 4 (100% Moral)</option>
                </select>
            </div>
            <div>
                <label for="premiumToggle">Warbond Premium aktiv?</label>
                <select id="premiumToggle" onchange="calculateResources()">
                    <option value="true">Ja (1500/h)</option>
                    <option value="false">Nein (1200/h)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Live Ressourcen-Bilanz -->
    <div class="card">
        <h2>Tagesproduktion (24h) & Startressourcen</h2>
        <table>
            <thead>
                <tr>
                    <th>Ressource</th>
                    <th>Startressourcen</th>
                    <th>Tagesproduktion (24h)</th>
                </tr>
            </thead>
            <tbody id="resourceTableBody">
                <!-- Dynamisch -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Originale Basisdaten aus der Google Tabelle
    const countryDatabase = {
        "Ägypten": { doctrine: "Alliierte", prod: { Getreide: 9250, Metal: 10410, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Algerien": { doctrine: "Alliierte", prod: { Getreide: 10410, Metal: 10410, Öl: 9250, Helme: 6810, Geld: 32380 } },
        "Deutschland": { doctrine: "Achse", prod: { Getreide: 9250, Metal: 10410, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Frankreich": { doctrine: "Alliierte", prod: { Getreide: 10410, Metal: 9250, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Grossbritannien": { doctrine: "Alliierte", prod: { Getreide: 10410, Metal: 9250, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Finnland": { doctrine: "Achse", prod: { Getreide: 9250, Metal: 10410, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Rumänien": { doctrine: "Komi", prod: { Getreide: 9250, Metal: 10410, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Italien": { doctrine: "Achse", prod: { Getreide: 10410, Metal: 10410, Öl: 9250, Helme: 6810, Geld: 32380 } },
        "Jugoslawien": { doctrine: "Komi", prod: { Getreide: 9250, Metal: 10410, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Komm. Russland": { doctrine: "Komi", prod: { Getreide: 9250, Metal: 10410, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Lybien": { doctrine: "Pan", prod: { Getreide: 10410, Metal: 9250, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Marokko": { doctrine: "Alliierte", prod: { Getreide: 9250, Metal: 10410, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Polen": { doctrine: "Komi", prod: { Getreide: 10410, Metal: 10410, Öl: 9250, Helme: 6810, Geld: 32380 } },
        "Russ. Kaiserreich": { doctrine: "Pan", prod: { Getreide: 10410, Metal: 10410, Öl: 9250, Helme: 6810, Geld: 32380 } },
        "Schweden": { doctrine: "Achse", prod: { Getreide: 10410, Metal: 10410, Öl: 9250, Helme: 6810, Geld: 32380 } },
        "Türkei": { doctrine: "Komi", prod: { Getreide: 10410, Metal: 10410, Öl: 9250, Helme: 6810, Geld: 32380 } },
        "Spanien": { doctrine: "Achse", prod: { Getreide: 9250, Metal: 10410, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Kaukasus": { doctrine: "Komi", prod: { Getreide: 10410, Metal: 9250, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Ukraine": { doctrine: "Achse", prod: { Getreide: 9250, Metal: 10410, Öl: 10410, Helme: 6810, Geld: 32380 } },
        "Nord USA": { doctrine: "Alliierte", prod: { Getreide: 0, Metal: 0, Öl: 0, Helme: 0, Geld: 0 } },
        "Süd USA": { doctrine: "Pan", prod: { Getreide: 0, Metal: 0, Öl: 0, Helme: 0, Geld: 0 } },
        "Kanada": { doctrine: "Alliierte", prod: { Getreide: 0, Metal: 0, Öl: 0, Helme: 0, Geld: 0 } },
        "Frei": { doctrine: "Keine", prod: { Getreide: 0, Metal: 0, Öl: 0, Helme: 0, Geld: 0 } }
    };

    const startResources = { Getreide: 15000, Metal: 15000, Öl: 15000, Helme: 12500, Geld: 80000 };
    const dayMultipliers = { 1: 1.0, 2: 1.1142857, 3: 1.2571428, 4: 1.4 };

    function initCountrySelect() {
        const select = document.getElementById('countrySelect');
        for (let country in countryDatabase) {
            let opt = document.createElement('option');
            opt.value = country;
            opt.textContent = country;
            if (country === "Deutschland") opt.selected = true;
            select.appendChild(opt);
        }
        updateCountryData();
    }

    function updateCountryData() {
        const country = document.getElementById('countrySelect').value;
        const data = countryDatabase[country];
        document.getElementById('doctrineDisplay').value = data.doctrine;
        calculateResources();
    }

    function calculateResources() {
        const country = document.getElementById('countrySelect').value;
        const baseProd = countryDatabase[country].prod;
        const day = document.getElementById('gameDay').value;
        const mult = dayMultipliers[day];

        const tbody = document.getElementById('resourceTableBody');
        tbody.innerHTML = '';

        for (let res in startResources) {
            let currentProd = Math.round(baseProd[res] * mult);
            let row = `<tr>
                <td><strong>${res}</strong></td>
                <td>${startResources[res].toLocaleString()}</td>
                <td>${currentProd.toLocaleString()}</td>
            </tr>`;
            tbody.innerHTML += row;
        }
    }

    window.onload = initCountrySelect;
</script>

</body>
</html>
