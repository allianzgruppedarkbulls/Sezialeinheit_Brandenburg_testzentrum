<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <title>Dark Bulls - Timer Verwaltung</title>
    <!-- config.js muss als Basis immer zuerst geladen werden -->
    <script src="config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        input, select { width: 100%; padding: 8px; background: #2c3e50; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { background: #e74c3c; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #c0392b; }
    </style>
</head>
<body>
    <h2>Timer & Map Verwaltung</h2>
    
    <div class="form-group">
        <label for="mapId">Map ID:</label>
        <input type="text" id="mapId" placeholder="z.B. Map_101">
    </div>
    
    <div class="form-group">
        <label for="userId">User ID:</label>
        <input type="text" id="userId" placeholder="z.B. User_123">
    </div>

    <div class="form-group">
        <label for="timerName">Timer Name / Event:</label>
        <input type="text" id="timerName" placeholder="z.B. Angriff auf Sektor 4">
    </div>

    <div class="form-group">
        <label for="targetSeconds">Zielzeit (Sekunden / Timestamp):</label>
        <input type="text" id="targetSeconds" placeholder="Zielzeitpunkt">
    </div>

    <button onclick="savePrivateTimer()">Private Timer speichern</button>

    <script>
        async function savePrivateTimer() {
            const payload = {
                action: "savePrivateTimer",
                mapId: document.getElementById('mapId').value,
                userId: document.getElementById('userId').value,
                timerName: document.getElementById('timerName').value,
                targetSeconds: document.getElementById('targetSeconds').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.success) {
                    alert("Timer erfolgreich gespeichert!");
                } else {
                    alert("Fehler: " + result.error);
                }
            } catch (err) {
                alert("Verbindungsfehler: " + err);
            }
        }
    </script>
</body>
</html>
