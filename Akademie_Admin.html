<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Bulls - Ausbildungs-Protokoll (Admin)</title>
    <!-- Zentrale Konfiguration laden -->
    <script src="config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #1e1e1e; border: 1px solid #441111; border-radius: 8px; padding: 20px; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        h1 { color: #ff4444; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #251a1a; border-radius: 6px; overflow: hidden; border: 1px solid #331a1a; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #331a1a; }
        th { background: #cc2222; color: #fff; font-weight: bold; }
        tr:hover { background: #2f1f1f; }
        .status-bestanden { color: #4caf50; font-weight: bold; }
        .status-bearbeitung { color: #ffeb3b; font-weight: bold; }
        .back-btn { background: #cc2222; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        .back-btn:hover { background: #ff4444; }
        .details-btn { background: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
        .details-btn:hover { background: #444; border-color: #ff4444; }

        /* Modal / Popup Styling */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); overflow: auto; }
        .modal-content { background-color: #1e1e1e; margin: 5% auto; padding: 25px; border: 1px solid #cc2222; width: 80%; max-width: 700px; border-radius: 8px; box-shadow: 0 0 20px rgba(204,34,34,0.3); }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: #ff4444; }
        
        .question-card { background: #251a1a; border: 1px solid #331a1a; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .question-card.richtig { border-left: 4px solid #4caf50; }
        .question-card.falsch { border-left: 4px solid #ff4444; }
        .ans-row { margin-top: 8px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <button class="back-btn" onclick="window.location.href='Ausbildung.html'">Zurück zur Akademie</button>
    <h1>Ausbildungs-Protokoll (Admin-Ansicht)</h1>
    
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Mitglied</th>
                    <th>Rang / Bereich</th>
                    <th>Status</th>
                    <th>Lektion</th>
                    <th>Prozent</th>
                    <th>Datum</th>
                    <th>Prüfungsdetails</th>
                </tr>
            </thead>
            <tbody id="protocolTableBody">
                <tr>
                    <td colspan="7" style="text-align: center;">Lade Protokoll-Daten...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- POPUP MODAL FÜR PRÜFUNGSDETAILS -->
<div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color: #ff4444; margin-top: 0;">Prüfungsdetails</h2>
        <div id="modalBody" style="max-height: 400px; overflow-y: auto; padding-right: 5px;">
            <!-- Hier werden die Fragen dynamisch eingefügt -->
        </div>
    </div>
</div>

<script>
    let globalEintraege = [];

    function loadProtocolData() {
        if (!window.BULLS_CONFIG || !window.BULLS_CONFIG.SCRIPT_URL) {
            document.getElementById("protocolTableBody").innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Fehler: config.js oder SCRIPT_URL nicht gefunden!</td></tr>`;
            return;
        }

        const SCRIPT_URL = window.BULLS_CONFIG.SCRIPT_URL;

        fetch(`${SCRIPT_URL}?action=getAkademieUebersicht`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("protocolTableBody");
                tbody.innerHTML = "";

                if (data.error) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Fehler: ${data.error}</td></tr>`;
                    return;
                }

                globalEintraege = data.eintraege || [];

                if (globalEintraege.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #888; font-style: italic;">Keine Protokoll-Einträge vorhanden.</td></tr>`;
                    return;
                }

                globalEintraege.forEach((row, index) => {
                    let statusClass = row.status === "Bestanden" ? "status-bestanden" : "status-bearbeitung";
                    
                    // Prüfen ob Spalte G (details) Daten enthält
                    let detailsBtnHtml = `<span style="color: #555; font-size: 0.85em;">Keine Daten</span>`;
                    if (row.details && row.details.trim() !== "") {
                        detailsBtnHtml = `<button class="details-btn" onclick="openDetails(${index})">Details ansehen 🔍</button>`;
                    }

                    let tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${row.user || "-"}</td>
                        <td>${row.rang || "-"}</td>
                        <td class="${statusClass}">${row.status || "-"}</td>
                        <td>${row.lektion || "-"}</td>
                        <td>${row.prozent || "-"}</td>
                        <td>${row.datum || "-"}</td>
                        <td>${detailsBtnHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error("Fehler beim Laden des Protokolls:", err);
                document.getElementById("protocolTableBody").innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Verbindungsfehler zur Datenbank.</td></tr>`;
            });
    }

    function openDetails(index) {
        let entry = globalEintraege[index];
        if (!entry || !entry.details) return;

        document.getElementById("modalTitle").innerText = `Prüfung: ${entry.user} (${entry.lektion})`;
        let modalBody = document.getElementById("modalBody");
        modalBody.innerHTML = "";

        try {
            let detailsArray = JSON.parse(entry.details);

            detailsArray.forEach((item, qIndex) => {
                let isRichtig = (item.status && item.status.toLowerCase() === "richtig");
                let cardClass = isRichtig ? "richtig" : "falsch";
                let statusText = isRichtig ? '<span style="color: #4caf50; font-weight: bold;">Richtig ✓</span>' : '<span style="color: #ff4444; font-weight: bold;">Falsch ✗</span>';

                let card = document.createElement("div");
                card.className = `question-card ${cardClass}`;
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <strong>Frage ${qIndex + 1}: ${item.frage}</strong>
                        <div>${statusText}</div>
                    </div>
                    <div class="ans-row">Antwort des Users: <strong>${item.gewaehlt || "Keine Antwort"}</strong></div>
                    ${!isRichtig ? `<div class="ans-row" style="color: #a3e4d7;">Richtige Antwort wäre: <strong>${item.korrekt}</strong></div>` : ""}
                `;
                modalBody.appendChild(card);
            });

        } catch (e) {
            modalBody.innerHTML = `<p style="color: red;">Fehler beim Lesen der Prüfungsdetails (Ungültiges Format).</p>`;
            console.error(e);
        }

        document.getElementById("detailsModal").style.display = "block";
    }

    function closeModal() {
        document.getElementById("detailsModal").style.display = "none";
    }

    // Schließen bei Klick außerhalb des Fensters
    window.onclick = function(event) {
        let modal = document.getElementById("detailsModal");
        if (event.target === modal) {
            modal.style.display = "none";
        }
    }

    loadProtocolData();
</script>

</body>
</html>
