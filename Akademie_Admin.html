<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Bulls - Ausbildungs-Protokoll (Admin)</title>
    <script src="config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #1e1e1e; border: 1px solid #441111; border-radius: 8px; padding: 20px; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        h1 { color: #ff4444; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #251a1a; border-radius: 6px; overflow: hidden; border: 1px solid #331a1a; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #331a1a; }
        th { background: #cc2222; color: #fff; font-weight: bold; }
        tr:hover { background: #2f1f1f; }
        .status-bestanden { color: #4caf50; font-weight: bold; }
        .status-bearbeitung { color: #ffeb3b; font-weight: bold; }
        .back-btn { background: #cc2222; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        .back-btn:hover { background: #ff4444; }
        .details-btn { background: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
        .details-btn:hover { background: #444; border-color: #ff4444; }

        /* Modal / Popup Styling */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); overflow: auto; }
        .modal-content { background-color: #1e1e1e; margin: 3% auto; padding: 25px; border: 1px solid #cc2222; width: 85%; max-width: 750px; border-radius: 8px; box-shadow: 0 0 20px rgba(204,34,34,0.3); }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: #ff4444; }

        /* Originalgetreue Quiz-Optik im Modal */
        .question-box { background: #251a1a; padding: 20px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #331a1a; }
        .answer-option { display: block; margin: 10px 0; background: #2a1f1f; padding: 12px; border-radius: 4px; border: 1px solid #442222; text-align: left; position: relative; }
        .answer-option.correct-answer { border-color: #2ecc71; background: #16261a; } /* Grüner Rahmen für die richtige Antwort */
        .answer-option input { margin-right: 10px; }
    </style>
</head>
<body>

<div class="container">
    <button class="back-btn" onclick="window.location.href='Ausbildung.html'">Zurück zur Akademie</button>
    <h1>Ausbildungs-Protokoll (Mitglieder-Übersicht)</h1>
    
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Mitglied</th>
                    <th>Abgeschlossene Lektionen</th>
                    <th>Aktion</th>
                </tr>
            </thead>
            <tbody id="protocolTableBody">
                <tr>
                    <td colspan="3" style="text-align: center;">Lade Mitglieder-Protokoll...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL: HISTORIE ODER PRÜFUNGS-ANSICHT -->
<div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color: #ff4444; margin-top: 0;">Details</h2>
        <div id="modalBody" style="max-height: 500px; overflow-y: auto; padding-right: 5px;">
            <!-- Inhalt wird dynamisch befüllt -->
        </div>
    </div>
</div>

<script>
    let userGruppen = {};

    function loadProtocolData() {
        if (!window.BULLS_CONFIG || !window.BULLS_CONFIG.SCRIPT_URL) {
            document.getElementById("protocolTableBody").innerHTML = `<tr><td colspan="3" style="text-align: center; color: red;">Fehler: config.js oder SCRIPT_URL nicht gefunden!</td></tr>`;
            return;
        }

        const SCRIPT_URL = window.BULLS_CONFIG.SCRIPT_URL;

        fetch(`${SCRIPT_URL}?action=getAkademieUebersicht`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("protocolTableBody");
                tbody.innerHTML = "";

                if (data.error) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: red;">Fehler: ${data.error}</td></tr>`;
                    return;
                }

                let eintraege = data.eintraege || [];
                userGruppen = {};

                // Daten im Browser dynamisch nach Mitgliedern gruppieren
                eintraege.forEach(row => {
                    let name = row.user || "Unbekannt";
                    if (!userGruppen[name]) userGruppen[name] = [];
                    userGruppen[name].push(row);
                });

                if (Object.keys(userGruppen).length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #888; font-style: italic;">Keine Protokoll-Einträge vorhanden.</td></tr>`;
                    return;
                }

                // Ebene 1: Jedes Mitglied in einer eigenen Zeile anzeigen
                Object.keys(userGruppen).forEach(userName => {
                    let lektionen = userGruppen[userName];
                    let bestandenCount = lektionen.filter(l => l.status === "Bestanden").length;

                    let tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td><strong>${userName}</strong></td>
                        <td>${bestandenCount} von ${lektionen.length} Lektion(en) absolviert</td>
                        <td><button class="details-btn" onclick="openUserHistory('${userName}')">Historie ansehen 📂</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error("Fehler beim Laden des Protokolls:", err);
                document.getElementById("protocolTableBody").innerHTML = `<tr><td colspan="3" style="text-align: center; color: red;">Verbindungsfehler zur Datenbank.</td></tr>`;
            });
    }

    // Ebene 2: Zeigt die Historie (alle Prüfungen) des ausgewählten Mitglieds
    function openUserHistory(userName) {
        let lektionen = userGruppen[userName];
        document.getElementById("modalTitle.innerText = `Historie von: ${userName}`; // korrigiert unten
        document.getElementById("modalTitle").innerText = `Ausbildungs-Historie: ${userName}`;
        
        let modalBody = document.getElementById("modalBody");
        modalBody.innerHTML = "";

        lektionen.forEach((item, index) => {
            let statusClass = item.status === "Bestanden" ? "status-bestanden" : "status-bearbeitung";
            let hasDetails = item.details && item.details.trim() !== "";

            let div = document.createElement("div");
            div.className = "question-box";
            div.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>${item.lektion}</strong> (${item.rang})<br>
                        <span style="font-size: 0.85em; color: #aaa;">Datum: ${item.datum || "-"} | Prozent: ${item.prozent || "-"}</span>
                    </div>
                    <div>
                        <span class="${statusClass}" style="margin-right: 15px;">${item.status}</span>
                        ${hasDetails ? `<button class="details-btn" onclick="openExamTestView('${userName}', ${index})">Prüfung ansehen 🔍</button>` : `<span style="color:#666; font-size:0.85em;">Keine Fragen-Daten</span>`}
                    </div>
                </div>
            `;
            modalBody.appendChild(div);
        });

        document.getElementById("detailsModal").style.display = "block";
    }

    // Ebene 3: Zeigt die echte Prüfung exakt so an, wie der User sie absolviert hat
    function openExamTestView(userName, index) {
        let item = userGruppen[userName][index];
        document.getElementById("modalTitle").innerText = `Prüfungstest: ${item.lektion} (${userName})`;
        let modalBody = document.getElementById("modalBody");
        modalBody.innerHTML = "";

        try {
            let detailsArray = JSON.parse(item.details);

            detailsArray.forEach((q, qIndex) => {
                let card = document.createElement("div");
                card.className = "question-box";
                
                let qHtml = `<p><strong>Frage ${qIndex + 1}: ${q.frage}</strong></p>`;

                // Da wir in den Details den Fragetext und die gewählte/korrekte Antwort speichern,
                // simulieren wir die Antwort-Boxen optisch exakt im Original-Design:
                let userChoice = (q.gewaehlt || "").trim();
                let correctChoice = (q.korrekt || "").trim();

                // Wir bauen die gewählte Antwort und die korrekte Antwort ein
                // (Falls das Log im JSON nur die Antworten speichert, fangen wir sie hier sicher ab)
                let isRichtig = (q.status && q.status.toLowerCase() === "richtig");

                let ansBoxClass = isRichtig ? "answer-option correct-answer" : "answer-option";
                
                qHtml += `
                    <div class="${ansBoxClass}">
                        <input type="radio" checked disabled>
                        Antwort des Users: <strong>${userChoice || "Keine Angabe"}</strong> 
                        ${isRichtig ? '<span style="color: #2ecc71; float: right;">(Richtig ✓)</span>' : '<span style="color: #ff4444; float: right;">(Falsch ✗)</span>'}
                    </div>
                `;

                if (!isRichtig) {
                    qHtml += `
                        <div class="answer-option correct-answer" style="margin-top: 5px;">
                            <input type="radio" disabled>
                            Richtige Antwort wäre gewesen: <strong>${correctChoice}</strong>
                        </div>
                    `;
                }

                card.innerHTML = qHtml;
                modalBody.appendChild(card);
            });

            // Zurück-Button um wieder in die Historie zu springen
            let backButtonHtml = `<button class="back-btn" onclick="openUserHistory('${userName}')" style="margin-top: 10px; width: 100%;">← Zurück zur Historie</button>`;
            modalBody.innerHTML += backButtonHtml;

        } catch (e) {
            modalBody.innerHTML = `<p style="color: red;">Fehler beim Laden der Prüfungsdetails.</p>`;
            console.error(e);
        }
    }

    function closeModal() {
        document.getElementById("detailsModal").style.display = "none";
    }

    window.onclick = function(event) {
        let modal = document.getElementById("detailsModal");
        if (event.target === modal) {
            modal.style.display = "none";
        }
    }

    loadProtocolData();
</script>

</body>
</html>
