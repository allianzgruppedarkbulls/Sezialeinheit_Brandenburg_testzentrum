<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: #fff; }
        #countdown { font-size: 3em; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h2 id="event-title">Lade Event...</h2>
    <div id="countdown">00:00:00</div>

    <script>
        const API = "HIER_DEINE_SCRIPT_URL"; // Bitte hier deine Web-App URL einfügen

        async function loadTimer() {
            const res = await fetch(API + "?action=getTimerSettings");
            const data = await res.json();
            document.getElementById('event-title').innerText = data.title;
            
            setInterval(() => {
                const target = new Date(data.targetDate).getTime();
                const now = new Date().getTime();
                const diff = target - now;

                if (diff > 0) {
                    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diff % (1000 * 60)) / 1000);
                    document.getElementById('countdown').innerText = `${d}d ${h}h ${m}m ${s}s`;
                } else {
                    document.getElementById('countdown').innerText = "ABGELAUFEN";
                }
            }, 1000);
        }
        loadTimer();
    </script>
</body>
</html>
