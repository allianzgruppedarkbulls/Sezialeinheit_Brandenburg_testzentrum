<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Bulls - Akademie</title>
    <!-- Zentrale Konfiguration laden -->
    <script src="config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1 { color: #ffcc00; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        .rubrik-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .rubrik-title { font-size: 1.2em; font-weight: bold; color: #ff9900; margin-bottom: 10px; }
        .lesson-list { list-style: none; padding: 0; margin: 0; }
        .lesson-item { padding: 10px; margin: 6px 0; background: #2a2a2a; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .status-green { color: #4caf50; font-weight: bold; }
        .status-yellow { color: #ffeb3b; font-weight: bold; }
        .status-red { color: #f44336; font-weight: bold; }
        .locked { color: #777; font-style: italic; }
        button { background: #ff9900; color: #000; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ffcc00; }
        button:disabled { background: #444; color: #777; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dark Bulls Akademie</h1>
    <p style="text-align: center;">Eingeloggt als: <span id="userNameDisplay" style="color: #ffcc00; font-weight: bold;">Lade...</span></p>
    
    <div id="akademieContent">
        <p style="text-align: center;">Lade Ausbildungsdaten...</p>
    </div>
</div>

<script>
    // URL-Parameter auslesen
    const urlParams = new URLSearchParams(window.location.search);
    const currentUser = urlParams.get('user') || "Julian"; 

    document.getElementById("userNameDisplay").innerText = currentUser;

    function loadAkademieData() {
        // Prüfen ob die zentrale config.js und SCRIPT_URL vorhanden sind
        if (!window.BULLS_CONFIG || !window.BULLS_CONFIG.SCRIPT_URL) {
            document.getElementById("akademieContent").innerHTML = `<p style="color: red; text-align: center;">Fehler: config.js oder SCRIPT_URL nicht gefunden!</p>`;
            return;
        }

        const SCRIPT_URL = window.BULLS_CONFIG.SCRIPT_URL;

        fetch(`${SCRIPT_URL}?action=getTrainingData&user=${encodeURIComponent(currentUser)}`)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById("akademieContent");
                container.innerHTML = "";

                if (data.error) {
                    container.innerHTML = `<p style="color: red;">Fehler: ${data.error}</p>`;
                    return;
                }

                for (let key in data) {
                    let rubrik = data[key];
                    let card = document.createElement("div");
                    card.className = "rubrik-card";

                    let titleHtml = `<div class="rubrik-title">${rubrik.title}</div>`;
                    let listHtml = `<ul class="lesson-list">`;

                    if (rubrik.lessons && rubrik.lessons.length > 0) {
                        rubrik.lessons.forEach(lesson => {
                            let statusText = "";
                            let statusClass = "";
                            
                            if (lesson.status === "green") {
                                statusText = "Bestanden / Offen";
                                statusClass = "status-green";
                            } else if (lesson.status === "yellow") {
                                statusText = "In Bearbeitung";
                                statusClass = "status-yellow";
                            } else if (lesson.status === "red") {
                                statusText = "Gesperrt (Vorherige Lektion nötig)";
                                statusClass = "status-red";
                            } else if (lesson.status === "locked") {
                                statusText = "Rang erforderlich";
                                statusClass = "locked";
                            }

                            listHtml += `
                                <li class="lesson-item">
                                    <span>${lesson.title}</span>
                                    <div>
                                        <span class="${statusClass}" style="margin-right: 15px; font-size: 0.9em;">${statusText}</span>
                                        <button ${lesson.status === "red" || lesson.status === "locked" ? "disabled" : ""} onclick="openLesson('${lesson.page}', '${key}', '${lesson.title}')">Starten</button>
                                    </div>
                                </li>`;
                        });
                    } else {
                        listHtml += `<li class="lesson-item"><span class="locked">Keine Inhalte verfügbar oder gesperrt für deinen Rang.</span></li>`;
                    }

                    listHtml += `</ul>`;
                    card.innerHTML = titleHtml + listHtml;
                    container.appendChild(card);
                }
            })
            .catch(err => {
                console.error("Fehler beim Laden:", err);
                document.getElementById("akademieContent").innerHTML = `<p style="color: red; text-align: center;">Verbindungsfehler zur Datenbank.</p>`;
            });
    }

    function openLesson(page, rang, lektion) {
        window.location.href = `${page}?user=${encodeURIComponent(currentUser)}&rang=${rang}&lektion=${encodeURIComponent(lektion)}`;
    }

    // Beim Laden ausführen
    loadAkademieData();
</script>

</body>
</html>
