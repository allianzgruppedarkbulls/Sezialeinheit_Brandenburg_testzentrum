<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>DARK BULLS - AKADEMIE ÜBERSICHT</title>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #050505; color: #ffffff; font-family: 'Almendra', serif; 
            margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container { 
            width: 750px; background-color: #0f0f0f; border: 2px solid #333; 
            border-radius: 15px; padding: 40px; box-shadow: 0 0 60px 15px rgba(255, 49, 49, 0.2); 
            box-sizing: border-box;
        }
        h1 { color: #ff3131; text-transform: uppercase; text-align: center; margin-bottom: 5px; letter-spacing: 3px; font-size: 28px; text-shadow: 0 0 15px rgba(255, 49, 49, 0.5); }
        .subtitle { color: #888; font-size: 16px; text-align: center; margin-bottom: 30px; text-transform: uppercase; }
        
        /* Ausbildungs-Karten */
        .path-wrapper { margin-bottom: 15px; border-radius: 10px; overflow: hidden; border: 1px solid #333; transition: 0.3s; background: #121212; }
        .path-card { padding: 20px; display: flex; align-items: center; justify-content: space-between; }
        .path-info h3 { margin: 0 0 5px 0; font-size: 20px; color: #fff; }
        .path-info p { margin: 0; color: #888; font-size: 14px; font-family: sans-serif; }
        
        /* Dropdown Bereich für die echten Tabellen-Lektionen */
        .dropdown-content { background: #0a0a0a; border-top: 1px solid #222; padding: 15px 20px; display: none; font-family: sans-serif; font-size: 14px; }
        .dropdown-content ul { margin: 0; padding-left: 0; list-style: none; }
        
        /* Lektionen-Eintrag mit Ampel-Farbe statt Pin */
        .lesson-item { 
            margin-bottom: 8px; border-bottom: 1px solid #151515; padding-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .lesson-link { text-decoration: none; display: flex; align-items: center; gap: 10px; font-weight: bold; transition: 0.2s; }
        
        /* Ampel-Farben für die einzelnen Lektionen */
        .lesson-link.green { color: #39d353; }
        .lesson-link.green:hover { text-shadow: 0 0 5px #39d353; }
        
        .lesson-link.yellow { color: #f0b232; }
        .lesson-link.yellow:hover { text-shadow: 0 0 5px #f0b232; }
        
        .lesson-link.red { color: #555; cursor: not-allowed; pointer-events: none; }

        .status-text { font-size: 12px; font-weight: normal; text-transform: uppercase; }
        .green-text { color: #39d353; }
        .yellow-text { color: #f0b232; }
        .red-text { color: #ff3131; }

        /* Toggle Button */
        .toggle-btn { background: #151515; border: none; color: #888; cursor: pointer; font-size: 14px; display: block; width: 100%; text-align: center; padding: 8px; transition: 0.2s; font-family: 'Almendra'; }
        .toggle-btn:hover { color: #fff; background: #1a1a1a; }

        .btn-back { display: block; margin-top: 30px; text-align: center; color: #666; text-decoration: none; text-transform: uppercase; font-size: 14px; transition: 0.3s; }
        .btn-back:hover { color: #fff; }
    </style>
</head>
<body onload="initTrainingOverview()">

<div class="container">
    <h1>Akademie & Ausbildung</h1>
    <div class="subtitle" id="userSubtitle">Lade Echtdaten aus der Tabelle...</div>

    <!-- Dynamische Liste direkt aus dem Sheet -->
    <div id="pathList">
        <p style="text-align: center; color: #666;">Verbinde mit der Datenbank...</p>
    </div>

    <a href="dashboard.html" class="btn-back">Zurück zum Hauptmenü</a>
</div>

<script>
    const API = window.BULLS_CONFIG.SCRIPT_URL;
    const playerName = localStorage.getItem("bulls_user");

    if (!playerName) {
        window.location.href = "index.html";
    }

    async function initTrainingOverview() {
        try {
            // Holt sowohl die Struktur (Kategorien & Lektionen wie B1, B2...) als auch den Fortschritt des Users aus dem Sheet
            let res = await fetch(`${API}?action=getFullTrainingData&user=${encodeURIComponent(playerName)}`);
            let data = await res.json();
            
            if (!data || !data.categories || data.categories.length === 0) {
                document.getElementById("pathList").innerHTML = `<p style="text-align: center; color: #ff3131;">Keine Ausbildungsdaten in der Tabelle gefunden.</p>`;
                document.getElementById("userSubtitle").innerText = `Kommandant: ${playerName}`;
                return;
            }

            document.getElementById("userSubtitle").innerText = `Kommandant: ${playerName} | Status-Übersicht`;
            renderTrainingUI(data.categories);

        } catch (e) {
            console.error("Fehler beim Laden der Tabellen-Daten:", e);
            document.getElementById("pathList").innerHTML = `<p style="text-align: center; color: #ff3131;">Fehler bei der Verbindung zum Server.</p>`;
        }
    }

    function renderTrainingUI(categories) {
        const list = document.getElementById("pathList");
        let html = "";

        categories.forEach((cat, index) => {
            // cat enthält: { id, title, description, lessons: [{ id: "B1", title: "...", status: "green/yellow/red", linkPage: "..." }] }
            
            let lessonsHTML = "<ul>";
            if (cat.lessons && cat.lessons.length > 0) {
                cat.lessons.forEach(lesson => {
                    // lesson.status kommt direkt aus der Tabelle: "green" (bestanden), "yellow" (aktuell), "red" (gesperrt)
                    let statusClass = lesson.status || "red"; 
                    let statusLabel = statusClass === "green" ? "Bestanden ✓" : (statusClass === "yellow" ? "Aktuell ⚡" : "Gesperrt 🔒");
                    let targetURL = statusClass === "red" ? "#" : `${lesson.linkPage || 'Ausb_Anfaenger.html'}?lektion=${lesson.id}`;

                    lessonsHTML += `
                        <li class="lesson-item">
                            <a href="${targetURL}" class="lesson-link ${statusClass}">
                                <span>[${lesson.id}] ${lesson.title}</span>
                            </a>
                            <span class="status-text ${statusClass}-text">${statusLabel}</span>
                        </li>`;
                });
            } else {
                lessonsHTML += `<li style="color: #666; text-align: center; padding: 5px;">Keine Lektionen hinterlegt.</li>`;
            }
            lessonsHTML += "</ul>";

            html += `
                <div class="path-wrapper">
                    <div class="path-card">
                        <div class="path-info">
                            <h3>${cat.title}</h3>
                            <p>${cat.description || ''}</p>
                        </div>
                    </div>
                    <button class="toggle-btn" onclick="toggleDropdown('${cat.id || index}')">▼ Lektionen aus der Tabelle anzeigen (${cat.lessons ? cat.lessons.length : 0}) ▼</button>
                    <div class="dropdown-content" id="drop-${cat.id || index}">
                        ${lessonsHTML}
                    </div>
                </div>
            `;
        });

        list.innerHTML = html;
    }

    function toggleDropdown(id) {
        let content = document.getElementById(`drop-${id}`);
        content.style.display = content.style.display === "block" ? "none" : "block";
    }
</script>

</body>
</html>
