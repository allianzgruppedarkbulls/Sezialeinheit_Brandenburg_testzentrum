<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>DARK BULLS - AKADEMIE ÜBERSICHT</title>
  <script src="config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #050505; color: #ffffff; font-family: 'Almendra', serif;
      margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .container {
      width: 750px; background-color: #0f0f0f; border: 2px solid #333;
      border-radius: 15px; padding: 40px; box-shadow: 0 0 60px 15px rgba(255, 49, 49, 0.2);
      box-sizing: border-box;
    }
    h1 { color: #ff3131; text-transform: uppercase; text-align: center; margin-bottom: 5px; letter-spacing: 3px; font-size: 28px; text-shadow: 0 0 15px rgba(255, 49, 49, 0.5); }
    .subtitle { color: #888; font-size: 16px; text-align: center; margin-bottom: 30px; text-transform: uppercase; }

    /* Aufklapp- / Akkordeon-Stil für die Kategorien */
    .dropdown-container { margin-bottom: 15px; }
    .category-card {
      background: #121212; border: 1px solid #333; border-radius: 10px; padding: 20px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: all 0.3s ease;
    }
    .category-card:hover { border-color: #ff3131; box-shadow: 0 0 15px rgba(255, 49, 49, 0.2); }
    .cat-info h3 { margin: 0 0 5px 0; font-size: 20px; color: #fff; }
    .cat-info p { margin: 0; color: #888; font-size: 14px; font-family: sans-serif; }

    /* Untermenü zum Aufklappen */
    .dropdown-content {
      display: none; background: #0a0a0a; border: 1px solid #222; border-top: none;
      border-radius: 0 0 10px 10px; padding: 15px; margin-top: -5px;
    }
    .dropdown-content.show { display: block; }
    .sub-item {
      display: block; color: #bbb; text-decoration: none; padding: 10px; margin-bottom: 5px;
      background: #151515; border-radius: 6px; font-family: sans-serif; font-size: 14px; transition: 0.2s;
    }
    .sub-item:hover { background: #ff3131; color: #000; padding-left: 15px; }

    .status-badge { font-size: 12px; font-family: sans-serif; font-weight: bold; padding: 6px 12px; border-radius: 4px; }
    .status-passed { color: #39d353; background: rgba(57, 211, 83, 0.1); border: 1px solid #39d353; }
    .status-open { color: #ff3131; background: rgba(255, 49, 49, 0.1); border: 1px solid #ff3131; }

    .btn-back {
      display: block; width: 100%; text-align: center; margin-top: 30px; background: transparent;
      border: 1px solid #444; color: #888; padding: 12px; font-family: 'Almendra', serif; font-size: 16px;
      letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 5px; text-decoration: none;
    }
    .btn-back:hover { border-color: #ff3131; color: #ff3131; box-shadow: 0 0 10px rgba(255, 49, 49, 0.3); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Akademie & Ausbildung</h1>
    <div class="subtitle" id="user-header">Kommandant: Lade... | Status-Übersicht</div>

    <div id="menu-container">
      <p style="text-align: center; color: #888;">Lade Berechtigungen...</p>
    </div>

    <a href="index.html" class="btn-back">Zurück zum Hauptmenü</a>
  </div>

  <script>
    var API_BASE_URL = window.BULLS_CONFIG ? window.BULLS_CONFIG.SCRIPT_URL : "";
    var currentPlayer = localStorage.getItem("darkBullsUser") || "Julian";

    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("user-header").innerText = "Kommandant: " + currentPlayer + " | Status-Übersicht";
      loadMenuStatus();
    });

    function loadMenuStatus() {
      if (!API_BASE_URL) {
        document.getElementById("menu-container").innerHTML = "<p style='text-align:center; color:#ff3131;'>Fehler: config.js nicht geladen oder SCRIPT_URL fehlt.</p>";
        return;
      }

      fetch(API_BASE_URL + "?action=getTrainingProgress&user=" + encodeURIComponent(currentPlayer))
        .then(res => res.json())
        .then(progress => {
          var container = document.getElementById("menu-container");
          container.innerHTML = "";

          // Definition der Hauptbereiche und ihrer aufklappbaren Lektionen
          var categories = [
            { 
              title: "Grundausbildung", 
              desc: "Grundlegende Spielmechaniken & Wirtschaft", 
              key: "Grundausbildung",
              page: "Ausb_Anfaenger.html",
              sublektionen: ["Einführung & Wirtschaft", "Truppenausbildung", "Kartenkontrolle"] 
            },
            { 
              title: "Fortgeschrittene Taktiken", 
              desc: "Erweiterte Strategien & Frontverläufe", 
              key: "Fortgeschritten",
              page: "Ausb_Fortgeschritten.html",
              sublektionen: ["Artillerie-Taktik", "Luftüberlegenheit", "Verteidigungslinien"] 
            },
            { 
              title: "Turnier & Spezialeinheit", 
              desc: "Taktiken für Ligen & verdeckte Operationen", 
              key: "Turnierspieler",
              page: "Ausb_Turnier.html",
              sublektionen: ["Koordination", "Geheime Operationen", "Endspiel-Taktik"] 
            }
          ];

          categories.forEach((cat, index) => {
            var isPassed = progress[cat.key] === "Bestanden" || progress[cat.key] == 1;
            var statusText = isPassed ? "FREIGESCHALTET ✓" : "OFFEN";
            var statusClass = isPassed ? "status-passed" : "status-open";

            var wrap = document.createElement("div");
            wrap.className = "dropdown-container";

            // Hauptkarte zum Anklicken / Aufklappen
            var card = document.createElement("div");
            card.className = "category-card";
            card.innerHTML = `
              <div class="cat-info">
                <h3>${cat.title} ▾</h3>
                <p>${cat.desc}</p>
              </div>
              <span class="status-badge ${statusClass}">${statusText}</span>
            `;

            // Aufklappbarer Bereich
            var dropdown = document.createElement("div");
            dropdown.className = "dropdown-content";
            dropdown.id = "dropdown-" + index;

            // Direkt-Link zur Hauptseite + Unterpunkte einfügen
            var mainLink = document.createElement("a");
            mainLink.className = "sub-item";
            mainLink.href = cat.page;
            mainLink.innerHTML = `<strong>⚡ Gesamten Lehrgang starten</strong>`;
            dropdown.appendChild(mainLink);

            cat.sublektionen.forEach(sub => {
              var subLink = document.createElement("a");
              subLink.className = "sub-item";
              subLink.href = cat.page + "?lektion=" + encodeURIComponent(sub);
              subLink.innerHTML = `🔹 ${sub}`;
              dropdown.appendChild(subLink);
            });

            // Klick-Event zum Ein-/Auklappen
            card.onclick = function() {
              var content = document.getElementById("dropdown-" + index);
              content.classList.toggle("show");
            };

            wrap.appendChild(card);
            wrap.appendChild(dropdown);
            container.appendChild(wrap);
          });
        })
        .catch(err => {
          console.error("Fehler beim Laden des Menüs:", err);
          document.getElementById("menu-container").innerHTML = "<p style='text-align:center; color:#ff3131;'>Fehler beim Laden der Berechtigungen.</p>";
        });
    }
  </script>
</body>
</html>
