<script>
    var API_BASE_URL = window.BULLS_CONFIG ? window.BULLS_CONFIG.SCRIPT_URL : "";
    var currentPlayer = localStorage.getItem("darkBullsUser") || "Julian";

    document.getElementById("user-header").innerText = "Kommandant: " + currentPlayer + " | Status-Übersicht";

    async function loadAkademieData() {
      if (!API_BASE_URL) {
        document.getElementById("menu-container").innerHTML = "<p style='text-align:center; color:#ff3131;'>Fehler: config.js nicht geladen.</p>";
        return;
      }

      try {
        let response = await fetch(API_BASE_URL + "?action=getTrainingData&user=" + encodeURIComponent(currentPlayer));
        let trainingData = await response.json();

        var container = document.getElementById("menu-container");
        container.innerHTML = "";

        var keys = ["grundausbildung", "fortgeschritten", "turnier"];

        keys.forEach((key, index) => {
          var catData = trainingData[key];
          if (!catData) return;

          var isPassed = catData.rankPassed;
          var statusText = isPassed ? "BESTANDEN ✓" : "OFFEN";
          var statusClass = isPassed ? "status-passed" : "status-open";

          var wrap = document.createElement("div");
          wrap.className = "dropdown-container";

          var card = document.createElement("div");
          card.className = "category-card";
          card.innerHTML = `
            <div class="cat-info">
              <h3>${catData.title} ▾</h3>
              <p>${catData.lessons.length} Lektion(en) verfügbar</p>
            </div>
            <span class="status-badge ${statusClass}">${statusText}</span>
          `;

          var dropdown = document.createElement("div");
          dropdown.className = "dropdown-content";
          dropdown.id = "dropdown-" + index;

          catData.lessons.forEach((lesson) => {
            var subLink = document.createElement("a");
            subLink.className = "sub-item";
            
            var isAbschluss = lesson.title.toLowerCase().includes("abschlussprüfung");
            var icon = isAbschluss ? "🏆 " : "🔹 ";

            if (lesson.status === "red") {
              subLink.classList.add("status-red");
              subLink.innerHTML = `<span>${icon}${lesson.title}</span> 🔒 Gesperrt`;
              subLink.href = "#";
              subLink.onclick = function(e) {
                e.preventDefault();
                alert("Diese Lektion ist noch gesperrt! Schließe zuerst die vorherigen Stationen ab, Kommandant.");
              };
            } else if (lesson.status === "green") {
              subLink.classList.add("status-green");
              subLink.innerHTML = `<span>${icon}${lesson.title}</span> <span style="font-size:11px; opacity:0.8;">Bestanden ✓</span>`;
              subLink.href = lesson.page + "?rang=" + key + "&lektion=" + encodeURIComponent(lesson.title);
            } else {
              subLink.classList.add("status-yellow");
              var badgeLabel = isAbschluss ? "Abschlussprüfung" : "Bereit ▶";
              subLink.innerHTML = `<span>${icon}${lesson.title}</span> <span style="font-size:11px; opacity:0.8;">${badgeLabel}</span>`;
              subLink.href = lesson.page + "?rang=" + key + "&lektion=" + encodeURIComponent(lesson.title);
            }

            dropdown.appendChild(subLink);
          });

          if (catData.lessons.length === 0) {
            var emptyLink = document.createElement("span");
            emptyLink.className = "sub-item";
            emptyLink.style.color = "#666";
            emptyLink.innerHTML = "Keine Lektionen im Tabellenblatt gefunden";
            dropdown.appendChild(emptyLink);
          }

          card.onclick = function() {
            dropdown.classList.toggle("show");
          };

          wrap.appendChild(card);
          wrap.appendChild(dropdown);
          container.appendChild(wrap);

        });

      } catch (err) {
        console.error("Fehler beim Laden:", err);
        document.getElementById("menu-container").innerHTML = "<p style='text-align:center; color:#ff3131;'>Fehler beim Laden der Akademie-Daten.</p>";
      }
    }
  </script>
