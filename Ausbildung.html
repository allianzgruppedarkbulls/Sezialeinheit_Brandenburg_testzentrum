<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Bulls - Akademie</title>
    <!-- Zentrale Konfiguration laden -->
    <script src="config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1 { color: #ff4444; text-align: center; text-shadow: 0 0 10px rgba(255, 68, 68, 0.3); }
        .container { max-width: 800px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1e1e1e; padding: 10px 15px; border-radius: 8px; border: 1px solid #441111; }
        .rubrik-card { background: #1e1e1e; border: 1px solid #441111; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .rubrik-title { font-size: 1.2em; font-weight: bold; color: #ff5555; margin-bottom: 10px; border-bottom: 1px solid #331111; padding-bottom: 5px; }
        .lesson-list { list-style: none; padding: 0; margin: 0; }
        .lesson-item { padding: 10px; margin: 6px 0; background: #251a1a; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #331a1a; }
        .status-green { color: #4caf50; font-weight: bold; }
        .status-yellow { color: #ffeb3b; font-weight: bold; }
        .status-red { color: #ff5555; font-weight: bold; }
        .locked { color: #777; font-style: italic; }
        button { background: #cc2222; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff4444; }
        button:disabled { background: #332222; color: #777; cursor: not-allowed; border: 1px solid #442222; }
        .admin-btn { background: #d32f2f; color: #fff; }
        .admin-btn:hover { background: #f44336; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dark Bulls Akademie</h1>
    
    <div class="header-bar">
        <div>Eingeloggt als: <span id="userNameDisplay" style="color: #ff5555; font-weight: bold;">Lade...</span></div>
        <button id="adminBtn" class="admin-btn hidden" onclick="window.location.href='Akademie_Admin.html'">Admin-Protokoll</button>
    </div>
    
    <div id="akademieContent">
        <p style="text-align: center;">Lade Ausbildungsdaten...</p>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const currentUser = urlParams.get('user') || "Julian"; 

    document.getElementById("userNameDisplay").innerText = currentUser;

    function loadAkademieData() {
        if (!window.BULLS_CONFIG || !window.BULLS_CONFIG.SCRIPT_URL) {
            document.getElementById("akademieContent").innerHTML = `<p style="color: red; text-align: center;">Fehler: config.js oder SCRIPT_URL nicht gefunden!</p>`;
            return;
        }

        const SCRIPT_URL = window.BULLS_CONFIG.SCRIPT_URL;

        fetch(`${SCRIPT_URL}?action=getTrainingData&user=${encodeURIComponent(currentUser)}`)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById("akademieContent");
                container.innerHTML = "";

                if (data.error) {
                    container.innerHTML = `<p style="color: red;">Fehler: ${data.error}</p>`;
                    return;
                }

                // Admin-Button Berechtigung prüfen
                fetch(`${SCRIPT_URL}?action=getTrainingProgress&user=${encodeURIComponent(currentUser)}&rang=Grundausbildung`)
                    .then(res => res.json())
                    .then(userMeta => {
                        if (userMeta.role && (userMeta.role.toLowerCase() === "admin" || userMeta.role.toLowerCase() === "elo")) {
                            document.getElementById("adminBtn").classList.remove("hidden");
                        }
                    }).catch(e => console.log("Rollenprüfung übersprungen"));

                // Prüfen, ob die Abschlussprüfung der Grundausbildung bestanden ist
                let grundausbildungBestanden = false;
                if (data.grundausbildung && data.grundausbildung.lessons) {
                    let abschlussPruefung = data.grundausbildung.lessons.find(l => l.title.toLowerCase().includes("abschlussprüfung"));
                    if (abschlussPruefung && abschlussPruefung.status === "green") {
                        grundausbildungBestanden = true;
                    }
                }

                for (let key in data) {
                    let rubrik = data[key];
                    let card = document.createElement("div");
                    card.className = "rubrik-card";

                    let titleHtml = `<div class="rubrik-title">${rubrik.title}</div>`;
                    let listHtml = `<ul class="lesson-list">`;

                    let isRubrikLocked = false;
                    // Fortgeschritten und Turnier sperren, solange Grundausbildung nicht komplett abgeschlossen ist
                    if ((key === "fortgeschritten" || key === "turnier") && !grundausbildungBestanden) {
                        isRubrikLocked = true;
                    }

                  // ... [vor der forEach Schleife]
if (rubrik.lessons && rubrik.lessons.length > 0) {
    let validLessonsCount = 0;
    
    // NEU: Diese Variable steuert die Kette
    let previousPassed = true; 

    rubrik.lessons.forEach(lesson => {
        let titleLower = lesson.title.trim().toLowerCase();
        if (titleLower.includes("lektions_name") || titleLower === "1" || titleLower === "titel" || titleLower === "") {
            return; 
        }

        validLessonsCount++;
        let statusText = "";
        let statusClass = "";
        let isDisabled = false;

        if (isRubrikLocked) {
            statusText = "Gesperrt (Grundausbildung nötig)";
            statusClass = "locked";
            isDisabled = true;
        } else {
            // LOGIK: Ist die Lektion bestanden?
            if (lesson.status === "green") {
                statusText = "Bestanden";
                statusClass = "status-green";
                previousPassed = true; // Kette bleibt offen
            } 
            // Ist es die erste Lektion, die noch NICHT grün ist?
            else if (previousPassed) {
                statusText = "In Bearbeitung";
                statusClass = "status-yellow";
                previousPassed = false; // Ab hier wird alles danach gesperrt
            } 
            // Alle folgenden Lektionen in der Kette
            else {
                statusText = "Gesperrt (Vorherige Lektion nötig)";
                statusClass = "status-red";
                isDisabled = true;
            }
        }

        listHtml += `
            <li class="lesson-item">
                <span>${lesson.title}</span>
                <div>
                    <span class="${statusClass}" style="margin-right: 15px; font-size: 0.9em;">${statusText}</span>
                    <button ${isDisabled ? "disabled" : ""} onclick="openLesson('${lesson.page}', '${key}', '${lesson.title}')">Starten</button>
                </div>
            </li>`;
    });
    // ... [restlicher Code]

                        if (validLessonsCount === 0) {
                            listHtml += `<li class="lesson-item"><span class="locked">Keine Inhalte verfügbar.</span></li>`;
                        }
                    } else {
                        listHtml += `<li class="lesson-item"><span class="locked">Keine Inhalte verfügbar.</span></li>`;
                    }

                    listHtml += `</ul>`;
                    card.innerHTML = titleHtml + listHtml;
                    container.appendChild(card);
                }
            })
            .catch(err => {
                console.error("Fehler beim Laden:", err);
                document.getElementById("akademieContent").innerHTML = `<p style="color: red; text-align: center;">Verbindungsfehler zur Datenbank.</p>`;
            });
    }

    function openLesson(page, rang, lektion) {
        window.location.href = `${page}?user=${encodeURIComponent(currentUser)}&rang=${rang}&lektion=${encodeURIComponent(lektion)}`;
    }

    loadAkademieData();
</script>

</body>
</html>
