<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>DARK BULLS - AKADEMIE ÜBERSICHT</title>
  <script src="config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #050505; color: #ffffff; font-family: 'Almendra', serif;
      margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .container {
      width: 750px; background-color: #0f0f0f; border: 2px solid #333;
      border-radius: 15px; padding: 40px; box-shadow: 0 0 60px 15px rgba(255, 49, 49, 0.2);
      box-sizing: border-box;
    }
    h1 { color: #ff3131; text-transform: uppercase; text-align: center; margin-bottom: 5px; letter-spacing: 3px; font-size: 28px; text-shadow: 0 0 15px rgba(255, 49, 49, 0.5); }
    .subtitle { color: #888; font-size: 16px; text-align: center; margin-bottom: 30px; text-transform: uppercase; }

    .path-wrapper { margin-bottom: 15px; border-radius: 10px; overflow: hidden; border: 1px solid #333; background: #121212; }
    .path-card { padding: 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .path-info h3 { margin: 0 0 5px 0; font-size: 20px; color: #fff; }
    .path-info p { margin: 0; color: #888; font-size: 14px; font-family: sans-serif; }

    .dropdown-content { background: #0a0a0a; border-top: 1px solid #222; padding: 15px 20px; display: none; font-family: sans-serif; font-size: 14px; }
    .dropdown-content ul { margin: 0; padding-left: 0; list-style: none; }

    .lesson-item {
      margin-bottom: 8px; border-bottom: 1px solid #151515; padding-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .lesson-link { text-decoration: none; display: flex; align-items: center; gap: 10px; font-weight: bold; color: #39d353; }
    .lesson-link:hover { text-shadow: 0 0 5px #39d353; }
    .lesson-status { font-size: 12px; font-family: sans-serif; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
    .status-passed { color: #39d353; background: rgba(57, 211, 83, 0.1); }
    .status-open { color: #ff3131; background: rgba(255, 49, 49, 0.1); }
    
    .btn-back {
      display: block; width: 100%; text-align: center; margin-top: 30px; background: transparent;
      border: 1px solid #444; color: #888; padding: 12px; font-family: 'Almendra', serif; font-size: 16px;
      letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 5px; text-decoration: none;
    }
    .btn-back:hover { border-color: #ff3131; color: #ff3131; box-shadow: 0 0 10px rgba(255, 49, 49, 0.3); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Akademie & Ausbildung</h1>
    <div class="subtitle" id="user-header">Kommandant: Lade... | Status-Übersicht</div>

    <div id="academy-container">
      <p style="text-align: center; color: #888;">Lade Echtdaten aus der Tabelle...</p>
    </div>

    <a href="index.html" class="btn-back">Zurück zum Hauptmenü</a>
  </div>

  <script>
    if (typeof API_BASE_URL === 'undefined') {
      var API_BASE_URL = "HIER_DEINE_ECHTE_APPS_SCRIPT_URL_EINTRAGEN"; 
    }

    var currentPlayer = localStorage.getItem("darkBullsUser") || "Julian"; 

    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("user-header").innerText = "Kommandant: " + currentPlayer + " | Status-Übersicht";
      loadAcademyData();
    });

    function loadAcademyData() {
      Promise.all([
        fetch(API_BASE_URL + "?action=getTrainingData").then(res => res.json()),
        fetch(API_BASE_URL + "?action=getTrainingProgress&user=" + encodeURIComponent(currentPlayer)).then(res => res.json()).catch(() => ({}))
      ])
      .then(([trainingData, progressData]) => {
        var container = document.getElementById("academy-container");
        container.innerHTML = "";

        // Die 3 separaten Bereiche, wie von dir gewünscht
        var keys = [
          { key: "grundausbildung", fallbackTitle: "Grundausbildung (Basis-Taktiken)" },
          { key: "fortgeschritten", fallbackTitle: "Fortgeschrittene Taktiken" },
          { key: "turnier", fallbackTitle: "Turnier & Spezialeinheit" }
        ];

        keys.forEach(kObj => {
          var cat = trainingData[kObj.key] || { title: kObj.fallbackTitle, lessons: [] };
          var wrapper = document.createElement("div");
          wrapper.className = "path-wrapper";

          var lessons = cat.lessons || [];
          var count = lessons.length;

          var card = document.createElement("div");
          card.className = "path-card";
          card.innerHTML = `
            <div class="path-info">
              <h3>${cat.title || kObj.fallbackTitle}</h3>
              <p>▼ Lektionen aus Tabelle einsehen (${count}) ▼</p>
            </div>
          `;

          var dropdown = document.createElement("div");
          dropdown.className = "dropdown-content";
          
          var ul = document.createElement("ul");
          if (count > 0) {
            lessons.forEach(lesson => {
              // Echten Status aus Protokoll prüfen (z.B. ob Status "Bestanden" ist, ansonsten "Offen")
              var isPassed = (progressData.status === "Bestanden" || progressData[lesson.title] === "Bestanden");
              var statusText = isPassed ? "BESTANDEN ✓" : "OFFEN";
              var statusClass = isPassed ? "status-passed" : "status-open";

              var li = document.createElement("div");
              li.className, "lesson-item";
              li.innerHTML = `
                <a href="${lesson.page || 'Ausb_Anfaenger.html'}?lektion=${encodeURIComponent(lesson.title)}" class="lesson-link">
                  ${lesson.title}
                </a>
                <span class="lesson-status ${statusClass}">${statusText}</span>
              `;
              ul.appendChild(li);
            });
          } else {
            ul.innerHTML = "<li style='color:#888; font-family:sans-serif; padding:5px 0;'>Keine Lektionen eingetragen (Bereich leer).</li>";
          }
          dropdown.appendChild(ul);

          // Aufklapp-Funktion per Klick
          card.addEventListener("click", function() {
            dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
          });

          wrapper.appendChild(card);
          wrapper.appendChild(dropdown);
          container.appendChild(wrapper);
        });
      })
      .catch(err => {
        console.error("Fehler beim Laden:", err);
        document.getElementById("academy-container").innerHTML = "<p style='text-align:center; color:#ff3131;'>Fehler beim Laden der Echtdaten.</p>";
      });
    }
  </script>
</body>
</html>
