<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Bulls - Akademie</title>
    <!-- Zentrale Konfiguration laden -->
    <script src="config.js"></script>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #0b0b0b; color: #d0d0d0; margin: 0; padding: 20px; }
        h1 { color: #ff3333; text-align: center; text-shadow: 0 0 12px rgba(255, 51, 51, 0.4); font-size: 2em; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .sub-header { text-align: center; color: #888; font-size: 0.9em; letter-spacing: 1px; margin-bottom: 25px; text-transform: uppercase; }
        .container { max-width: 850px; margin: 0 auto; background: #121212; border: 1px solid #2a1212; border-radius: 8px; padding: 25px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #161616; padding: 12px 18px; border-radius: 6px; border: 1px solid #331111; }
        
        .rubrik-card { background: #161616; border: 1px solid #331111; border-radius: 6px; padding: 15px 20px; margin-bottom: 20px; }
        .rubrik-top { display: flex; justify-content: space-between; align-items: center; }
        .rubrik-title { font-size: 1.15em; font-weight: bold; color: #ff4444; }
        .rubrik-info { font-size: 0.8em; color: #777; margin-top: 4px; }
        
        .badge-offen { border: 1px solid #ff4444; color: #ff4444; padding: 4px 12px; border-radius: 4px; font-size: 0.8em; font-weight: bold; text-transform: uppercase; background: rgba(255,68,68,0.05); }
        
        .lesson-list { list-style: none; padding: 0; margin: 15px 0 0 0; border-top: 1px solid #221111; padding-top: 10px; }
        .lesson-item { padding: 12px 15px; margin: 8px 0; background: #1a1212; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2c1616; }
        .lesson-title { color: #e0e0e0; font-size: 0.95em; }

        /* Buttons & Badges im alten Style */
        .btn-bereit { background: linear-gradient(to bottom, #d4af37, #aa820a); color: #000; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .btn-bereit:hover { background: linear-gradient(to bottom, #ffd700, #d4af37); }

        .btn-bestanden { background: rgba(76, 175, 80, 0.15); color: #4caf50; border: 1px solid #4caf50; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit; }
        .btn-bestanden:hover { background: rgba(76, 175, 80, 0.3); }

        .badge-gesperrt { color: #777; font-size: 0.85em; background: #1a1a1a; border: 1px solid #2a2a2a; padding: 4px 10px; border-radius: 4px; }

        .admin-btn { background: #d32f2f; color: #fff; padding: 6px 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; }
        .admin-btn:hover { background: #f44336; }
        .hidden { display: none; }
        
        .btn-back-menu { display: block; width: 100%; background: transparent; border: 1px solid #331a1a; color: #888; text-align: center; padding: 12px; border-radius: 4px; margin-top: 30px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; text-decoration: none; box-sizing: border-box; }
        .btn-back-menu:hover { border-color: #ff4444; color: #ff4444; background: rgba(255,68,68,0.02); }
    </style>
</head>
<body>

<div class="container">
    <h1>Akademie & Ausbildung</h1>
    <div class="sub-header">Kommandant: <span id="userNameDisplay">Lade...</span> | Status-Übersicht</div>
    
    <div class="header-bar">
        <div>Zentrale Steuerung</div>
        <button id="adminBtn" class="admin-btn hidden" onclick="window.location.href='Akademie_Admin.html'">Admin-Protokoll</button>
    </div>
    
    <div id="akademieContent">
        <p style="text-align: center;">Lade Ausbildungsdaten...</p>
    </div>

    <button class="btn-back-menu" onclick="window.location.href='index.html'">Zurück zum Hauptmenü</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const currentUser = urlParams.get('user') || "Julian"; 

    document.getElementById("userNameDisplay").innerText = currentUser.toUpperCase();

    function loadAkademieData() {
        if (!window.BULLS_CONFIG || !window.BULLS_CONFIG.SCRIPT_URL) {
            document.getElementById("akademieContent").innerHTML = `<p style="color: red; text-align: center;">Fehler: config.js oder SCRIPT_URL nicht gefunden!</p>`;
            return;
        }

        const SCRIPT_URL = window.BULLS_CONFIG.SCRIPT_URL;

        fetch(`${SCRIPT_URL}?action=getTrainingData&user=${encodeURIComponent(currentUser)}`)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById("akademieContent");
                container.innerHTML = "";

                if (data.error) {
                    container.innerHTML = `<p style="color: red;">Fehler: ${data.error}</p>`;
                    return;
                }

                // Admin-Button Berechtigung prüfen
                fetch(`${SCRIPT_URL}?action=getTrainingProgress&user=${encodeURIComponent(currentUser)}&rang=Grundausbildung`)
                    .then(res => res.json())
                    .then(userMeta => {
                        if (userMeta.role && (userMeta.role.toLowerCase() === "admin" || userMeta.role.toLowerCase() === "elo")) {
                            document.getElementById("adminBtn").classList.remove("hidden");
                        }
                    }).catch(e => console.log("Rollenprüfung übersprungen"));

                // Prüfen, ob die Abschlussprüfung der Grundausbildung bestanden ist
                let grundausbildungBestanden = false;
                if (data.grundausbildung && data.grundausbildung.lessons) {
                    let abschlussPruefung = data.grundausbildung.lessons.find(l => l.title.toLowerCase().includes("abschlussprüfung"));
                    if (abschlussPruefung && abschlussPruefung.status === "green") {
                        grundausbildungBestanden = true;
                    }
                }

                for (let key in data) {
                    let rubrik = data[key];
                    let card = document.createElement("div");
                    card.className = "rubrik-card";

                    // Zähle gültige Lektionen
                    let validLessons = [];
                    if (rubrik.lessons && rubrik.lessons.length > 0) {
                        rubrik.lessons.forEach(lesson => {
                            let titleLower = lesson.title.trim().toLowerCase();
                            if (!titleLower.includes("lektions_name") && titleLower !== "1" && titleLower !== "titel" && titleLower !== "") {
                                validLessons.push(lesson);
                            }
                        });
                    }

                    let topHtml = `
                        <div class="rubrik-top">
                            <div>
                                <div class="rubrik-title">${rubrik.title}</div>
                                <div class="rubrik-info">${validLessons.length} Lektion(en) verfügbar</div>
                            </div>
                            <div class="badge-offen">Offen</div>
                        </div>`;

                    let listHtml = `<ul class="lesson-list">`;

                    let isRubrikLocked = false;
                    if ((key === "fortgeschritten" || key === "turnier") && !grundausbildungBestanden) {
                        isRubrikLocked = true;
                    }

                    if (validLessons.length > 0) {
                        let previousPassed = true;

                        validLessons.forEach(lesson => {
                            let badgeHtml = "";
                            let isDisabled = false;

                            if (isRubrikLocked) {
                                badgeHtml = `<span class="badge-gesperrt">Gesperrt 🔒</span>`;
                                isDisabled = true;
                            } else {
                                if (lesson.status === "green") {
                                    // Bestandene Lektionen sind jetzt über einen Button jederzeit wieder aufrufbar
                                    badgeHtml = `<button class="btn-bestanden" onclick="openLesson('${lesson.page}', '${key}', '${lesson.title}')">Ansehen ✓</button>`;
                                    previousPassed = true;
                                } else if (previousPassed) {
                                    badgeHtml = `<button class="btn-bereit" onclick="openLesson('${lesson.page}', '${key}', '${lesson.title}')">Bereit ►</button>`;
                                    previousPassed = false; // Folgende blockieren
                                } else {
                                    badgeHtml = `<span class="badge-gesperrt">Gesperrt 🔒</span>`;
                                    isDisabled = true;
                                }
                            }

                            listHtml += `
                                <li class="lesson-item">
                                    <span class="lesson-title">${lesson.title}</span>
                                    <div>${badgeHtml}</div>
                                </li>`;
                        });
                    } else {
                        listHtml += `<li class="lesson-item"><span style="color: #777; font-style: italic;">Keine Inhalte verfügbar.</span></li>`;
                    }

                    listHtml += `</ul>`;
                    card.innerHTML = topHtml + listHtml;
                    container.appendChild(card);
                }
            })
            .catch(err => {
                console.error("Fehler beim Laden:", err);
                document.getElementById("akademieContent").innerHTML = `<p style="color: red; text-align: center;">Verbindungsfehler zur Datenbank.</p>`;
            });
    }

    function openLesson(page, rang, lektion) {
        window.location.href = `${page}?user=${encodeURIComponent(currentUser)}&rang=${rang}&lektion=${encodeURIComponent(lektion)}`;
    }

    loadAkademieData();
</script>

</body>
</html>
