<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>DARK BULLS - AUSBILDUNG</title>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #050505; color: #ffffff; font-family: 'Almendra', serif; 
            margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container { 
            width: 650px; background-color: #0f0f0f; border: 2px solid #333; 
            border-radius: 15px; padding: 40px; box-shadow: 0 0 60px 15px rgba(255, 49, 49, 0.2); 
            text-align: center;
        }
        h1 { color: #ff3131; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 3px; font-size: 32px; text-shadow: 0 0 15px rgba(255, 49, 49, 0.5); }
        .subtitle { color: #888; font-size: 18px; margin-bottom: 30px; }
        .content-card {
            background: #121212; border: 1px solid #ff3131; border-radius: 10px; padding: 25px; margin-bottom: 25px; text-align: center; color: #f0b232; font-size: 18px;
        }
        .btn-back { display: block; margin-top: 30px; color: #666; text-decoration: none; text-transform: uppercase; font-size: 16px; transition: 0.3s; }
        .btn-back:hover { color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>Akademie & Ausbildung</h1>
    <div class="subtitle">Der Weg zum Elite-Mitglied</div>

    <div class="content-card" id="loadingText">
        Prüfe Ausbildungs-Protokoll... 🔄
    </div>

    <a href="dashboard.html" class="btn-back">Zurück zum Hauptmenü</a>
</div>

<script>
    const API = window.BULLS_CONFIG.SCRIPT_URL;
    const playerName = localStorage.getItem("bulls_user");

    if (!playerName) {
        window.location.href = "index.html";
    } else {
        checkUserTrainingStatus();
    }

    async function checkUserTrainingStatus() {
        try {
            let res = await fetch(`${API}?action=getTrainingProgress&user=${encodeURIComponent(playerName)}`);
            let data = await res.json();
            
            let rang = data.currentRang || data.rang || "Grundausbildung";
            
            // Korrigiert von innerHTML zu innerText, damit kein Fehler auftritt
            document.getElementById("loadingText").innerText = `Leite weiter zu: ${rang}...`;

            if (rang.toLowerCase().includes("fortgeschritten")) {
                window.location.href = "Ausb_Fortgeschritten.html";
            } else if (rang.toLowerCase().includes("turnier")) {
                window.location.href = "Ausb_Turnier.html";
            } else {
                window.location.href = "Ausb_Anfaenger.html";
            }

        } catch (e) {
            window.location.href = "Ausb_Anfaenger.html";
        }
    }
</script>

</body>
</html>
